<title>CS Prep</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&family=Unbounded:wght@600;800&display=swap">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
/* Layout: одна колонка «листа подготовки» — список эфиров по дням, карточка матча с вкладками.
   Цвета команд — стороны CS: первая команда в синем CT, вторая в золотом T. Красный — лампа «в эфире». */
:root {
  --bg: #eef0f4;
  --surface: #ffffff;
  --sunk: #e3e6ec;
  --line: #d3d8e1;
  --fg: #151a23;
  --muted: #5d6676;
  --ct: #3f63a8;
  --ct-soft: #dbe4f5;
  --t: #b9790f;
  --t-soft: #f6e7c8;
  --onair: #d8322a;
  --onair-soft: #fbe0de;
  --win: #1f8a4c;
  --loss: #c2413a;
  --display: "Unbounded", "Golos Text", system-ui, sans-serif;
  --body: "Golos Text", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --r: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #101319; --surface: #181c24; --sunk: #0c0f14; --line: #2a303c; --fg: #e8ebf1; --muted: #8d96a7;
    --ct: #7d9ee0; --ct-soft: #1e2a42; --t: #e3a945; --t-soft: #3a2d14; --onair: #ff5a4f; --onair-soft: #3d1a18;
    --win: #4cc283; --loss: #ff6b62; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #101319; --surface: #181c24; --sunk: #0c0f14; --line: #2a303c; --fg: #e8ebf1; --muted: #8d96a7;
  --ct: #7d9ee0; --ct-soft: #1e2a42; --t: #e3a945; --t-soft: #3a2d14; --onair: #ff5a4f; --onair-soft: #3d1a18;
  --win: #4cc283; --loss: #ff6b62; color-scheme: dark;
}
html, body { background: var(--bg); color: var(--fg); }
body {
  font-family: var(--body); font-size: 15px; line-height: 1.45; margin: 0;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 32px;
  -webkit-font-smoothing: antialiased;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.wrap { max-width: 640px; margin: 0 auto; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
button:focus-visible, a:focus-visible { outline: 2px solid var(--ct); outline-offset: 2px; border-radius: 6px; }
a { color: inherit; }
.num { font-family: var(--mono); font-variant-numeric: tabular-nums; }

/* шапка */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); padding-block: 14px 10px; display: flex; flex-direction: column; gap: 10px; }
.brand { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.brand h1 { font-family: var(--display); font-weight: 800; font-size: 20px; letter-spacing: .01em; margin: 0; }
.brand h1 b { color: var(--onair); }
.upd { font-size: 12px; color: var(--muted); }
.seg { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { padding: 6px 12px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); font-size: 13px; font-weight: 500; white-space: nowrap; }
.chip[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.chip .c { color: var(--muted); margin-left: 4px; }
.chip[aria-pressed="true"] .c { color: inherit; opacity: .7; }

/* список */
.day { margin-top: 18px; display: flex; flex-direction: column; gap: 8px; }
.day h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; margin: 0 0 2px; }
.match { display: grid; grid-template-columns: 52px 1fr auto; gap: 12px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px; text-align: left; width: 100%; position: relative; }
.match.mine { border-color: var(--onair); box-shadow: inset 3px 0 0 var(--onair); }
.match .time { font-family: var(--mono); font-weight: 700; font-size: 15px; }
.match .time small { display: block; font-size: 11px; color: var(--muted); font-weight: 500; }
.match .time .live { color: var(--onair); }
.vs { min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.vs .row { display: flex; align-items: center; gap: 8px; min-width: 0; }
.vs .tname { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dot { width: 8px; height: 8px; border-radius: 2px; flex: none; }
.dot.a { background: var(--ct); } .dot.b { background: var(--t); }
.vs .tour { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
.side { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
.pill { font-family: var(--mono); font-size: 11px; padding: 2px 6px; border-radius: 4px; background: var(--sunk); color: var(--muted); font-weight: 700; }
.pill.s { background: var(--fg); color: var(--bg); }
.mic { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; border: 1px solid var(--line); color: var(--muted); }
.mic[aria-pressed="true"] { background: var(--onair); border-color: var(--onair); color: #fff; }
.mic svg { width: 16px; height: 16px; }
.nodetail { opacity: .6; }
.empty { margin-top: 40px; text-align: center; color: var(--muted); display: flex; flex-direction: column; gap: 6px; align-items: center; }
.empty strong { color: var(--fg); font-size: 16px; }

/* карточка матча */
.back { display: inline-flex; align-items: center; gap: 6px; font-weight: 600; color: var(--muted); padding: 4px 0; }
.hero { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: flex; flex-direction: column; gap: 12px; margin-top: 4px; }
.hero .meta { font-size: 12px; color: var(--muted); display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.face { display: grid; grid-template-columns: 1fr auto 1fr; gap: 10px; align-items: center; }
.face .tm { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.face .tm:last-child { text-align: right; align-items: flex-end; }
.face .acr { font-family: var(--display); font-weight: 800; font-size: 26px; line-height: 1; }
.face .tm.a .acr { color: var(--ct); } .face .tm.b .acr { color: var(--t); }
.face .full { font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
.face .mid { font-family: var(--mono); font-weight: 700; text-align: center; font-size: 13px; color: var(--muted); }
.face .mid b { display: block; color: var(--fg); font-size: 20px; }
.heroacts { display: flex; gap: 8px; flex-wrap: wrap; }
.btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 12px; border-radius: 8px; border: 1px solid var(--line); font-size: 13px; font-weight: 600; text-decoration: none; }
.btn.on { background: var(--onair); border-color: var(--onair); color: #fff; }
.btn svg { width: 15px; height: 15px; }

.tabs { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 4; background: var(--bg); display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; padding-block: 12px 8px; }
.tab { padding: 9px 4px; border-radius: 8px; font-weight: 600; font-size: 14px; color: var(--muted); background: var(--sunk); }
.tab[aria-selected="true"] { background: var(--fg); color: var(--bg); }
.tab .c { font-family: var(--mono); font-size: 11px; opacity: .7; margin-left: 2px; }

.sec { display: flex; flex-direction: column; gap: 10px; margin-top: 14px; }
.sec > h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; margin: 0; display: flex; justify-content: space-between; gap: 8px; }
.sec > h3 span { text-transform: none; letter-spacing: 0; font-weight: 500; }
.box { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); }
.note { font-size: 13px; color: var(--muted); padding: 12px; }

/* личные встречи */
.tally { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 14px 16px; gap: 12px; border-bottom: 1px solid var(--line); }
.tally .n { font-family: var(--display); font-weight: 800; font-size: 30px; line-height: 1; }
.tally .n.a { color: var(--ct); } .tally .n.b { color: var(--t); text-align: right; }
.tally .lbl { font-size: 12px; color: var(--muted); text-align: center; }
.bar2 { height: 6px; border-radius: 3px; overflow: hidden; display: flex; background: var(--sunk); grid-column: 1 / -1; }
.bar2 i { display: block; height: 100%; }
.bar2 .a { background: var(--ct); } .bar2 .b { background: var(--t); }
.h2h { display: flex; flex-direction: column; }
.h2h .it { padding: 10px 16px; display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; border-top: 1px solid var(--line); }
.h2h .it:first-child { border-top: 0; }
.h2h .d { font-size: 12px; color: var(--muted); }
.h2h .tr { font-size: 13px; font-weight: 500; min-width: 0; overflow-wrap: anywhere; }
.h2h .sc { font-family: var(--mono); font-weight: 700; grid-row: 1 / 3; grid-column: 2; align-self: center; font-size: 16px; }
.sc .a { color: var(--ct); } .sc .b { color: var(--t); } .sc .x { color: var(--muted); padding: 0 2px; }
.maps { grid-column: 1 / -1; display: flex; gap: 4px; flex-wrap: wrap; }
.mp { font-size: 11px; font-weight: 600; padding: 2px 7px; border-radius: 4px; }
.mp.a { background: var(--ct-soft); color: var(--ct); } .mp.b { background: var(--t-soft); color: var(--t); } .mp.n { background: var(--sunk); color: var(--muted); }

/* карты */
.mtab { width: 100%; border-collapse: collapse; font-size: 13px; }
.mtab th { font-size: 11px; color: var(--muted); font-weight: 600; text-align: left; padding: 10px 12px 6px; }
.mtab th.r, .mtab td.r { text-align: right; }
.mtab td { padding: 8px 12px; border-top: 1px solid var(--line); vertical-align: middle; }
.mtab .mn { font-weight: 600; }
.wr { display: flex; align-items: center; gap: 8px; }
.wr .pct { font-family: var(--mono); font-weight: 700; min-width: 38px; }
.wr .gp { font-family: var(--mono); font-size: 11px; color: var(--muted); }
.wr .track { flex: 1; height: 5px; border-radius: 3px; background: var(--sunk); min-width: 30px; overflow: hidden; }
.wr .track i { display: block; height: 100%; }
.a .track i { background: var(--ct); } .b .track i { background: var(--t); }
.a .pct { color: var(--ct); } .b .pct { color: var(--t); }
.best { font-size: 10px; font-weight: 700; color: var(--win); text-transform: uppercase; letter-spacing: .06em; }

.mapsel { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
.recent { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.recent .col { display: flex; flex-direction: column; gap: 0; min-width: 0; }
.recent .hd { font-weight: 700; font-size: 13px; padding: 10px 12px 6px; }
.recent .a .hd { color: var(--ct); } .recent .b .hd { color: var(--t); }
.recent .g { padding: 7px 12px; border-top: 1px solid var(--line); font-size: 13px; display: flex; justify-content: space-between; gap: 6px; }
.recent .g .d { font-size: 11px; color: var(--muted); }
.wl { font-family: var(--mono); font-weight: 700; font-size: 12px; }
.wl.w { color: var(--win); } .wl.l { color: var(--loss); }

/* форма */
.form { display: flex; flex-direction: column; }
.form .tmh { padding: 10px 12px 6px; font-weight: 700; font-size: 13px; display: flex; justify-content: space-between; }
.form .tmh.a { color: var(--ct); } .form .tmh.b { color: var(--t); }
.sec > .box.form + .box.form { margin-top: 0; }
.form .tmh span { font-family: var(--mono); color: var(--muted); font-weight: 500; }
.squares { display: flex; gap: 4px; padding: 0 12px 10px; flex-wrap: wrap; }
.sq { width: 26px; height: 26px; border-radius: 5px; display: grid; place-items: center; font-family: var(--mono); font-size: 11px; font-weight: 700; color: #fff; }
.sq.w { background: var(--win); } .sq.l { background: var(--loss); }
.fl { padding: 0 12px 10px; display: flex; flex-direction: column; gap: 2px; font-size: 12px; color: var(--muted); }
.fl div { display: flex; gap: 8px; } .fl .wl { min-width: 32px; }

/* игроки */
.roster .hd { padding: 10px 12px 4px; font-weight: 700; font-size: 13px; display: flex; justify-content: space-between; }
.roster.a .hd { color: var(--ct); } .roster.b .hd { color: var(--t); }
.pl { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; padding: 10px 12px; border-top: 1px solid var(--line); width: 100%; text-align: left; }
.pl .nick { font-weight: 700; font-size: 16px; }
.pron { font-weight: 500; font-size: 13px; color: var(--muted); }
.pl .rn { font-size: 12px; color: var(--muted); }
.pl .nb { grid-row: 1 / 3; grid-column: 2; align-self: center; font-size: 12px; font-weight: 600; padding: 4px 8px; border-radius: 6px; background: var(--sunk); color: var(--muted); }
.pl .nb.has { background: var(--onair-soft); color: var(--onair); }

/* турниры */
.tours { display: flex; flex-direction: column; gap: 8px; margin-top: 8px; }
.tour-card { display: grid; grid-template-columns: 1fr auto; gap: 6px 12px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; width: 100%; text-align: left; }
.tour-card .tn { font-family: var(--display); font-weight: 600; font-size: 15px; line-height: 1.25; text-wrap: balance; min-width: 0; }
.tour-card .tm2 { font-size: 12px; color: var(--muted); display: flex; gap: 6px; flex-wrap: wrap; align-items: center; grid-column: 1 / -1; }
.tour-card .tm2 b { color: var(--fg); font-weight: 600; }
.tour-card .tm2 .live { color: var(--onair); font-weight: 700; }
.tour-card .go { align-self: start; }
.tour-card.today { border-color: var(--fg); }
.tour-card .muted { color: var(--muted); }
.tour-card .spanrow { margin-top: -2px; }
.tour-card .span { font-size: 11px; font-weight: 600; color: var(--t); background: var(--t-soft); padding: 1px 7px; border-radius: 4px; }
.sect-title.month { font-size: 13px; color: var(--fg); margin-top: 20px; }
.mine-bar { display: flex; justify-content: space-between; align-items: center; gap: 12px; background: var(--onair-soft); color: var(--onair); border-radius: var(--r); padding: 12px 14px; font-weight: 600; width: 100%; text-align: left; }
.mine-bar .num { font-size: 18px; }
.subhead { display: flex; flex-direction: column; gap: 4px; }
.subhead h1 { font-family: var(--display); font-weight: 600; font-size: 18px; margin: 0; line-height: 1.25; text-wrap: balance; }
.subhead .upd { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.sect-title { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; margin: 18px 0 0; }

/* роли */
.rtags { grid-column: 1 / -1; display: flex; gap: 4px; flex-wrap: wrap; margin-top: 2px; }
.rt { font-size: 11px; font-weight: 700; padding: 2px 7px; border-radius: 4px; background: var(--sunk); color: var(--muted); }
.rt.cap { background: var(--onair-soft); color: var(--onair); }
.rt.awp { background: var(--t-soft); color: var(--t); }
.rt.rif { background: var(--ct-soft); color: var(--ct); }
.coach { padding: 10px 12px; border-top: 1px solid var(--line); display: flex; justify-content: space-between; gap: 10px; font-size: 13px; }
.coach .lbl { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; }
.coach b { font-size: 15px; }

/* призовые */
.prz-share { padding: 10px 12px 2px; font-size: 12px; color: var(--muted); }
.prz-row { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; padding: 8px 12px; border-top: 1px solid var(--line); align-items: baseline; }
.prz-row:first-child { border-top: 0; }
.prz-pl { font-weight: 600; } .prz-pl small { color: var(--muted); font-weight: 500; }
.prz-money { text-align: right; font-weight: 700; display: flex; flex-direction: column; align-items: flex-end; }
.prz-money small { font-weight: 500; font-size: 11px; color: var(--muted); }
.prz-spot { grid-column: 1 / -1; font-size: 12px; color: var(--ct); font-weight: 600; }
.prz-team { grid-column: 1 / -1; font-size: 12px; color: var(--muted); }
/* мейджор */
.mj-row { display: grid; grid-template-columns: 40px 1fr auto; gap: 10px; padding: 9px 12px; border-top: 1px solid var(--line); align-items: start; }
.mj-row:first-child { border-top: 0; }
.mj-row.wait { opacity: .75; }
.mj-pos { color: var(--muted); font-size: 13px; padding-top: 1px; }
.mj-name { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.mj-name small { font-size: 12px; color: var(--muted); }
.mj-name small.warn { color: var(--loss); font-weight: 600; }
.mj-name .ok { color: var(--win); font-weight: 700; }
.mj-pts { font-weight: 700; font-size: 13px; }

/* лента */
.hometabs { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
.feedch { margin-top: 10px; }
.feed .sect-title { margin-top: 14px; }
.fi { text-decoration: none; color: inherit; width: 100%; text-align: left; }
.fi .chn { color: var(--fg); font-weight: 600; }
.fi-body { display: flex; gap: 10px; align-items: flex-start; }
.fi-body img { width: 84px; height: 84px; object-fit: cover; border-radius: 8px; flex: none; background: var(--sunk); }
.fi-body > span { min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.fi-body p { white-space: pre-line; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }

/* читалка новости */
.rd { display: flex; flex-direction: column; gap: 12px; margin-top: 4px; max-width: 65ch; }
.rd h1 { font-family: var(--display); font-weight: 600; font-size: 20px; line-height: 1.3; margin: 0; text-wrap: balance; }
.rd-meta, .rd-orig, .rd-tr, .rd-note { font-size: 12px; color: var(--muted); }
.rd-orig { font-style: italic; }
.rd-tr { color: var(--ct); font-weight: 600; }
.rd img { border-radius: 10px; width: 100%; max-height: 240px; object-fit: cover; background: var(--sunk); }
.rd p { margin: 0; font-size: 16px; line-height: 1.6; }
.rd .rd-empty { color: var(--muted); font-size: 14px; }
.rd blockquote { margin: 0; padding: 10px 14px; border-left: 3px solid var(--t); background: var(--t-soft); border-radius: 0 8px 8px 0; font-size: 15px; line-height: 1.5; }
.rd blockquote cite { display: block; font-style: normal; font-size: 12px; color: var(--muted); margin-top: 4px; }
.rd .readbtn { align-self: flex-start; margin-top: 4px; }
button.ni { width: 100%; text-align: left; }
.also { display: flex; flex-direction: column; gap: 0; border-top: 1px solid var(--line); padding-top: 10px; margin-top: 4px; }
.also a { display: flex; flex-direction: column; gap: 2px; padding: 8px 0; border-bottom: 1px solid var(--line); text-decoration: none; color: inherit; font-size: 13px; }
.also a b { font-size: 12px; color: var(--ct); }

/* стороны */
.sides { padding: 4px 0 8px; }
.sd-head, .sd-row { display: grid; grid-template-columns: 1.4fr 1fr 1fr 1.3fr; gap: 8px; padding: 6px 12px; align-items: baseline; }
.sd-head { font-size: 11px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .06em; }
.sd-row { border-top: 1px solid var(--line); font-size: 15px; font-weight: 700; }
.sd-row .sd-t { font-family: var(--display); font-size: 14px; display: flex; flex-direction: column; }
.sd-row.a .sd-t { color: var(--ct); } .sd-row.b .sd-t { color: var(--t); }
.sd-row small { font-family: var(--body); font-size: 11px; color: var(--muted); font-weight: 500; margin-left: 4px; }
.sd-row .sd-t small { margin-left: 0; }
.sd-row .good { color: var(--win); } .sd-row .bad { color: var(--loss); }
.sd-all { padding: 0 12px 6px; font-size: 12px; color: var(--muted); }
.sd-all span { font-weight: 600; }
.pstat { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12px; color: var(--muted); margin-top: 4px; }
.pstat b { color: var(--fg); font-family: var(--mono); font-weight: 700; }

/* вето */
.vpool { padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; }
.vpool .lbl { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; }
.vrow { display: grid; grid-template-columns: 92px 1fr; gap: 8px; padding: 6px 12px; border-top: 1px solid var(--line); font-size: 13px; }
.vrow span:first-child { color: var(--muted); font-size: 12px; }
.vrow b { font-family: var(--mono); }

/* факты */
.facts { display: flex; flex-direction: column; }
.fact { display: grid; grid-template-columns: 74px 1fr; gap: 10px; padding: 10px 12px; border-top: 1px solid var(--line); font-size: 14px; line-height: 1.45; }
.fact:first-child { border-top: 0; }
.ftag { font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; padding-top: 2px; }
.fmore { padding: 10px 12px; border-top: 1px solid var(--line); color: var(--ct); font-weight: 600; font-size: 13px; text-align: left; }

/* группы по турнирам */
.grp { display: flex; flex-direction: column; }
.grp .gh { padding: 8px 12px 4px; font-size: 11px; font-weight: 600; color: var(--muted); border-top: 1px solid var(--line); display: flex; justify-content: space-between; gap: 8px; }
.grp:first-of-type .gh { border-top: 0; }
.grp .gh span:first-child { min-width: 0; overflow-wrap: anywhere; }
.grp .gr { padding: 5px 12px; display: grid; grid-template-columns: 1fr auto; gap: 8px; font-size: 13px; align-items: baseline; }
.grp .gr:last-child { padding-bottom: 9px; }
.grp .gr .d { font-size: 11px; color: var(--muted); }
.recent2 { display: flex; flex-direction: column; gap: 8px; }
.recent2 .hd { font-weight: 700; font-size: 13px; padding: 10px 12px 2px; display: flex; justify-content: space-between; }
.recent2 .a .hd { color: var(--ct); } .recent2 .b .hd { color: var(--t); }
.recent2 .hd span { font-family: var(--mono); color: var(--muted); font-weight: 500; }

/* новости */
.filt { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
.news { display: flex; flex-direction: column; gap: 8px; }
.ni { padding: 12px; display: flex; flex-direction: column; gap: 6px; }
a.ni { text-decoration: none; color: inherit; }
.ni .open { color: var(--ct); font-weight: 600; }
.ni .head { display: flex; flex-direction: column; gap: 6px; text-align: left; width: 100%; padding: 0; }
.ni .chev { margin-left: auto; color: var(--muted); transition: transform .15s; }
.ni.open .chev { transform: rotate(180deg); }
.ni.open { border-color: var(--fg); }
.body { display: flex; flex-direction: column; gap: 10px; padding-top: 6px; border-top: 1px solid var(--line); margin-top: 4px; }
.body img { border-radius: 8px; max-height: 200px; object-fit: cover; width: 100%; background: var(--sunk); }
.body .lead { font-size: 15px; line-height: 1.55; margin: 0; color: var(--fg); }
.body .trn { font-size: 12px; color: var(--muted); display: flex; justify-content: space-between; gap: 8px; align-items: center; flex-wrap: wrap; }
.body .trn button { color: var(--ct); font-weight: 600; font-size: 12px; padding: 0; }
.body .acts { display: flex; gap: 8px; flex-wrap: wrap; }
.readbtn { display: inline-flex; align-items: center; gap: 6px; padding: 9px 14px; border-radius: 8px; background: var(--fg); color: var(--bg); font-weight: 600; font-size: 14px; text-decoration: none; }
.ni .tags { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.kind { font-size: 11px; font-weight: 700; padding: 2px 7px; border-radius: 4px; background: var(--sunk); color: var(--muted); }
.kind.k-интервью, .kind.k-заявление { background: var(--ct-soft); color: var(--ct); }
.kind.k-соцсети { background: var(--onair-soft); color: var(--onair); }
.kind.k-трансфер, .kind.k-слухи { background: var(--t-soft); color: var(--t); }
.who { font-size: 12px; font-weight: 600; }
.ni h4 { margin: 0; font-size: 15px; line-height: 1.35; font-weight: 600; text-wrap: pretty; }
.ni p { margin: 0; font-size: 13px; color: var(--muted); }
.ni .orig { font-size: 12px; color: var(--muted); font-style: italic; }
.ni .src { font-size: 12px; color: var(--muted); display: flex; gap: 8px; justify-content: space-between; align-items: center; }
.ni .src a { font-weight: 600; color: var(--ct); text-decoration: none; }
.banner { font-size: 12px; color: var(--muted); padding: 10px 12px; border: 1px dashed var(--line); border-radius: 8px; }
@media (prefers-reduced-motion: no-preference) { .view { animation: in .18s ease-out; } @keyframes in { from { opacity: .4; transform: translateY(4px); } to { opacity: 1; transform: none; } } }
</style>

<div class="wrap" id="app"></div>

<script>
(function () {
  "use strict";
  var TG = window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initData ? window.Telegram.WebApp : null;
  if (TG) {
    try {
      TG.ready(); TG.expand();
      document.documentElement.setAttribute("data-theme", TG.colorScheme === "light" ? "light" : "dark");
      TG.onEvent && TG.onEvent("themeChanged", function () { document.documentElement.setAttribute("data-theme", TG.colorScheme === "light" ? "light" : "dark"); });
    } catch (e) {}
  }
  var $app = document.getElementById("app");
  var DEMO = window.__DATA__ || null;
  var state = { list: null, details: {}, view: "home", tab: "stats", newsFilter: "all", map: null };

  // ---------- хранилище «комментирую»
  var MINE_KEY = "csprep.mine";
  function loadMine() { try { return JSON.parse(localStorage.getItem(MINE_KEY) || "[]"); } catch (e) { return []; } }
  var mine = new Set(loadMine());
  function toggleMine(id) {
    id = String(id);
    if (mine.has(id)) mine.delete(id); else mine.add(id);
    try { localStorage.setItem(MINE_KEY, JSON.stringify(Array.from(mine))); } catch (e) {}
    try { TG && TG.HapticFeedback && TG.HapticFeedback.selectionChanged(); } catch (e) {}
  }

  // ---------- утилиты
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  var TZ = "Europe/Moscow";
  function d(s) { return s ? new Date(s) : null; }
  function fmt(dt, opts) { return new Intl.DateTimeFormat("ru-RU", Object.assign({ timeZone: TZ }, opts)).format(dt); }
  function hm(s) { var x = d(s); return x ? fmt(x, { hour: "2-digit", minute: "2-digit" }) : "—"; }
  function dmy(s) { var x = d(s); return x ? fmt(x, { day: "numeric", month: "short", year: "2-digit" }).replace(" г.", "") : ""; }
  function dm(s) { var x = d(s); return x ? fmt(x, { day: "numeric", month: "short" }) : ""; }
  function dayKey(s) { var x = d(s); return x ? fmt(x, { year: "numeric", month: "2-digit", day: "2-digit" }) : "?"; }
  function dayTitle(s) {
    var x = d(s), now = new Date();
    var k = dayKey(s), today = dayKey(now.toISOString()), tom = dayKey(new Date(now.getTime() + 864e5).toISOString());
    var base = fmt(x, { weekday: "long", day: "numeric", month: "long" });
    if (k === today) return "Сегодня · " + base;
    if (k === tom) return "Завтра · " + base;
    return base;
  }
  function ago(s) {
    var x = d(s); if (!x) return "";
    var m = Math.round((Date.now() - x.getTime()) / 60000);
    if (m < 60) return m + " мин назад";
    if (m < 60 * 24) return Math.round(m / 60) + " ч назад";
    return dm(s);
  }
  function abbr(t) { return t ? (t.acronym || t.name || "TBD") : "TBD"; }
  function flag(cc) {
    if (!cc || cc.length !== 2) return "";
    return String.fromCodePoint.apply(null, cc.toUpperCase().split("").map(function (c) { return 127397 + c.charCodeAt(0); }));
  }
  function pct(w, p) { return p ? Math.round(100 * w / p) : 0; }
  var MIC = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>';
  var ARROW = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>';
  var PLAY = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>';

  function openLink(url) {
    if (!url) return;
    if (TG && TG.openLink) { try { TG.openLink(url); return; } catch (e) {} }
    var a = document.createElement("a"); a.href = url; a.target = "_blank"; a.rel = "noopener"; document.body.appendChild(a); a.click(); a.remove();
  }

  // ---------- данные
  function bust() { return "?t=" + Math.floor(Date.now() / 60000); }
  function getList() {
    if (DEMO) return Promise.resolve(DEMO.list);
    return fetch("data/matches.json" + bust()).then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); });
  }
  function getDetail(id) {
    if (state.details[id]) return Promise.resolve(state.details[id]);
    var p = DEMO ? Promise.resolve(DEMO.details[id]) : fetch("data/match/" + id + ".json" + bust()).then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); });
    return p.then(function (x) { if (!x) throw new Error("нет данных"); state.details[id] = x; return x; });
  }

  // ---------- списки
  function usd(n) { return n == null ? "" : "$" + Number(n).toLocaleString("ru-RU"); }
  function prize(p) {
    if (!p) return "";
    var m = /^(\d+)\s*(.*)$/.exec(String(p).trim());
    if (!m) return String(p);
    var cur = /dollar/i.test(m[2]) ? "$" : /euro/i.test(m[2]) ? "€" : "";
    var n = Number(m[1]).toLocaleString("ru-RU");
    return cur ? cur + n : n + " " + m[2];
  }
  function tourOf(m) { return String((m.serie && m.serie.id) || m.tournament); }
  function findTour(id) { return (state.list.tournaments || []).find(function (t) { return String(t.id) === String(id); }); }

  function matchRow(m, showTour) {
    var a = m.teams[0], b = m.teams[1], on = mine.has(String(m.id));
    var live = m.status === "running";
    var sub = showTour ? (m.stage ? m.tournament + " · " + m.stage : m.tournament) : (m.stage || m.tournament);
    return '<div class="match' + (m.has_detail ? "" : " nodetail") + '" data-open="' + m.id + '" role="button" tabindex="0" aria-label="' + esc(abbr(a) + " против " + abbr(b)) + '">' +
      '<div class="time">' + (live ? '<span class="live">LIVE</span>' : esc(hm(m.begin_at))) + '<small>BO' + esc(m.bo || "?") + '</small></div>' +
      '<div class="vs"><div class="row"><span class="dot a"></span><span class="tname">' + esc(a ? a.name : "TBD") + '</span></div>' +
      '<div class="row"><span class="dot b"></span><span class="tname">' + esc(b ? b.name : "TBD") + '</span></div>' +
      '<div class="tour">' + esc(sub) + '</div></div>' +
      '<div class="side">' + (showTour ? '<span class="pill ' + esc(m.tier) + '">' + esc((m.tier || "?").toUpperCase()) + '</span>' : '') + '</div></div>';
  }

  function byDays(ms, showTour) {
    var html = "", cur = null;
    ms.forEach(function (m) {
      var k = dayKey(m.begin_at);
      if (!cur || cur !== k) { if (cur) html += '</section>'; cur = k; html += '<section class="day"><h2>' + esc(dayTitle(m.begin_at)) + '</h2>'; }
      html += matchRow(m, showTour);
    });
    return cur ? html + '</section>' : html;
  }

  function homeHeader(active) {
    var L = state.list;
    return '<div class="view"><header class="top"><div class="brand"><h1>CS<b>·</b>Prep</h1>' +
      '<span class="upd">обновлено ' + esc(ago(L.updated)) + ' · время МСК</span></div>' +
      '<div class="hometabs" role="tablist"><button class="tab" data-home="tours" aria-selected="' + (active === "tours") + '">Турниры</button>' +
      '<button class="tab" data-home="feed" aria-selected="' + (active === "feed") + '">Лента</button></div></header>';
  }

  function getFeed() {
    if (DEMO) return Promise.resolve(DEMO.feed || { items: [] });
    if (state.feed) return Promise.resolve(state.feed);
    return fetch("data/feed.json" + bust()).then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(function (f) { state.feed = f; return f; });
  }

  function feedReader(n) {
    var html = '<div class="view reader"><div style="padding-top:12px">' + (TG ? '' : '<button class="back" id="close-freader">' + ARROW + 'Лента</button>') + '</div>' +
      '<article class="rd"><div class="rd-meta"><b>' + esc(n.channel_title) + '</b> · ' + esc(dmy(n.date)) + ' ' + esc(hm(n.date)) + '</div>' +
      (n.photo ? '<img src="' + esc(n.photo) + '" alt="" loading="lazy" onerror="this.remove()">' : '') +
      String(n.full || n.text || n.title).split(/\n+/).filter(Boolean).map(function (p) { return '<p>' + esc(p) + '</p>'; }).join("") +
      '<a class="readbtn" href="' + esc(n.url) + '" data-tg="' + esc(n.url) + '" target="_blank" rel="noopener">Открыть в Telegram</a>';
    if ((n.also || []).length) {
      html += '<div class="also"><div class="rd-meta">Также в каналах</div>' + n.also.map(function (a) {
        return '<a href="' + esc(a.url) + '" data-tg="' + esc(a.url) + '" target="_blank" rel="noopener"><b>' + esc(a.channel_title) + '</b></a>';
      }).join("") + '</div>';
    }
    return html + '</article></div>';
  }

  function renderFeed() {
    var html = homeHeader("feed");
    var F = state.feed;
    if (F && state.feedRead) {
      var it = (F.items || []).find(function (x) { return x.key === state.feedRead; });
      if (it) { $app.innerHTML = feedReader(it); try { TG && TG.BackButton.show(); } catch (e) {} return; }
      state.feedRead = null;
    }
    if (!F) { $app.innerHTML = html + '<div class="empty">Загружаю ленту…</div></div>'; return; }
    var ch = state.feedCh || "all";
    var items = (F.items || []).filter(function (n) { return ch === "all" || n.channel === ch || (n.also || []).some(function (a) { return a.channel === ch; }); });
    html += '<div class="filt feedch" role="group" aria-label="Канал"><button class="chip" data-feedch="all" aria-pressed="' + (ch === "all") + '">Все каналы</button>' +
      (F.channels || []).map(function (c) { return '<button class="chip" data-feedch="' + esc(c.id) + '" aria-pressed="' + (ch === c.id) + '">' + esc(c.title) + '</button>'; }).join("") + '</div>';
    if (!items.length) html += '<div class="empty"><strong>Пока пусто</strong>Лента собирается вместе с остальными данными каждые 3 часа.</div>';
    var cur = null;
    html += '<div class="news feed">';
    items.forEach(function (n) {
      var k = dayKey(n.date);
      if (k !== cur) { cur = k; html += '<h2 class="sect-title">' + esc(dayTitle(n.date)) + '</h2>'; }
      html += '<button class="box ni fi" data-fread="' + esc(n.key) + '">' +
        '<span class="src"><span><b class="chn">' + esc(n.channel_title) + '</b> · ' + esc(hm(n.date)) + '</span>' +
        ((n.also || []).length ? '<span>ещё в ' + n.also.length + ' ' + (n.also.length === 1 ? "канале" : "каналах") + '</span>' : '') + '</span>' +
        '<span class="fi-body">' + (n.photo ? '<img src="' + esc(n.photo) + '" alt="" loading="lazy" onerror="this.remove()">' : '') +
        '<span><h4>' + esc(n.title) + '</h4>' + (n.text && n.text !== n.title ? '<p>' + esc(n.text) + '</p>' : '') + '</span></span></button>';
    });
    $app.innerHTML = html + '</div></div>';
  }

  var MONTHS = ["январь", "февраль", "март", "апрель", "май", "июнь", "июль", "август", "сентябрь", "октябрь", "ноябрь", "декабрь"];
  var MONTHS_IN = ["январе", "феврале", "марте", "апреле", "мае", "июне", "июле", "августе", "сентябре", "октябре", "ноябре", "декабре"];
  function ym(s) { var d = new Date(s); var p = new Intl.DateTimeFormat("en-CA", { timeZone: TZ, year: "numeric", month: "2-digit" }).format(d).split("-"); return { y: +p[0], m: +p[1] - 1 }; }
  function ymKey(o) { return o.y * 12 + o.m; }

  function renderHome() {
    var L = state.list;
    var tours = L.tournaments || [];
    var today = dayKey(new Date().toISOString());
    var html = homeHeader("tours");
    if (!tours.length) { $app.innerHTML = html + '<div class="empty"><strong>Турниров тир-1 нет</strong>Данные обновляются каждые 3 часа.</div></div>'; return; }
    var nowK = ymKey(ym(new Date().toISOString()));
    var months = {};
    tours.forEach(function (t) {
      var b = t.begin || t.next, e = t.end || b;
      if (!b) return;
      var bk = ymKey(ym(b)), ek = ymKey(ym(e));
      for (var k = Math.max(bk, nowK); k <= ek; k++) (months[k] = months[k] || []).push({ t: t, bk: bk, ek: ek, k: k });
    });
    Object.keys(months).map(Number).sort(function (a, b) { return a - b; }).forEach(function (k) {
      var y = Math.floor(k / 12), m = k % 12;
      html += '<h2 class="sect-title month">' + MONTHS[m].charAt(0).toUpperCase() + MONTHS[m].slice(1) + ' ' + y + '</h2><div class="tours">';
      months[k].forEach(function (x) {
        var t = x.t;
        var ms = (L.matches || []).filter(function (mm) { return tourOf(mm) === String(t.id); });
        var todayN = ms.filter(function (mm) { return dayKey(mm.begin_at) === today; }).length;
        var b = t.begin || t.next, e = t.end;
        var dates = b ? dm(b) + (e && dayKey(e) !== dayKey(b) ? " – " + dm(e) : "") : "";
        var live = t.live || (b && e && new Date(b) <= new Date() && new Date(e) >= new Date());
        var span = "";
        if (x.ek > x.k) { var n = (x.k + 1) % 12; span = '<span class="span">→ продолжится в ' + MONTHS_IN[n] + '</span>'; }
        if (x.bk < x.k) { var p0 = ((x.k - 1) % 12 + 12) % 12; span += '<span class="span">← начался в ' + MONTHS_IN[p0] + '</span>'; }
        var next = t.live ? '<span class="live">● LIVE ' + t.live + '</span>'
          : ms.length ? (t.next ? 'ближайший <b>' + esc(dayKey(t.next) === today ? "сегодня " + hm(t.next) : dm(t.next) + " " + hm(t.next)) + '</b>' : '')
          : '<span class="muted">расписание пока не опубликовано</span>';
        html += '<button class="tour-card' + (todayN ? " today" : "") + '" data-tour="' + esc(t.id) + '">' +
          '<span class="tn">' + esc(t.name) + '</span><span class="pill go ' + esc(t.tier) + '">' + esc((t.tier || "?").toUpperCase()) + '</span>' +
          '<span class="tm2">' + [dates && '<b>' + esc(dates) + '</b>', live && !t.live ? '<span class="live">идёт сейчас</span>' : '',
            (t.prize_usd || t.prize) && esc(t.prize_usd ? usd(t.prize_usd) : prize(t.prize)),
            todayN ? '<b>сегодня ' + todayN + '</b>' : (ms.length ? ms.length + ' матч.' : ''), next].filter(Boolean).join(' · ') + '</span>' +
          (span ? '<span class="tm2 spanrow">' + span + '</span>' : '') + '</button>';
      });
      html += '</div>';
    });
    $app.innerHTML = html + '</div>';
  }

  function renderTour(id) {
    var L = state.list, t = findTour(id);
    var ms = (L.matches || []).filter(function (m) { return tourOf(m) === String(id); });
    var html = '<div class="view"><header class="top">' + backBtn("Турниры") +
      '<div class="subhead"><h1>' + esc(t ? t.name : "Турнир") + '</h1><span class="upd">' +
      (t ? '<span class="pill ' + esc(t.tier) + '">' + esc((t.tier || "").toUpperCase()) + '</span>' + (t.begin ? esc(dm(t.begin) + (t.end ? " – " + dm(t.end) : "")) : "") + (t.prize ? " · " + esc(prize(t.prize)) : "") : "") +
      '</span></div></header>';
    html += ms.length ? byDays(ms, false) : '<div class="empty"><strong>Расписание пока не опубликовано</strong>Матчи появятся здесь, как только организаторы их объявят.</div>';
    if (t && t.hltv) html += prizeBlock(t.hltv);
    $app.innerHTML = html + '</div>';
  }

  function placeRu(p) { return String(p || "").replace(/(st|nd|rd|th)$/i, "").replace(/-/, "–") + " место"; }

  function prizeBlock(h) {
    var html = '<div class="sec"><h3>Призовые и слоты <span>' + esc(usd(h.prize)) + '</span></h3><div class="box prz">';
    if (h.player_share || h.club_share) html += '<div class="prz-share">игрокам ' + esc(usd(h.player_share)) + ' · клубам ' + esc(usd(h.club_share)) + '</div>';
    (h.places || []).forEach(function (p) {
      html += '<div class="prz-row"><span class="prz-pl">' + esc(placeRu(p.place)) + (p.count > 1 ? ' <small>×' + p.count + '</small>' : '') + '</span>' +
        '<span class="prz-money num">' + (p.prize ? esc(usd(p.prize)) : '') + (p.club ? '<small>+ клубу ' + esc(usd(p.club)) + '</small>' : '') + '</span>' +
        ((p.spots || []).length ? '<span class="prz-spot">→ ' + esc(p.spots.join(", ")) + '</span>' : '') +
        ((p.teams || []).length ? '<span class="prz-team">' + esc(p.teams.join(", ")) + '</span>' : '') + '</div>';
    });
    html += '</div></div>';
    if ((h.teams || []).length) {
      html += '<div class="sec"><h3>Участники <span>как попали</span></h3><div class="box">' + h.teams.map(function (t) {
        return '<div class="prz-row"><span class="prz-pl">' + esc(t.name) + '</span><span class="prz-spot" style="grid-column:auto">' + esc(howRu(t.how)) + '</span></div>';
      }).join("") + '</div></div>';
    }
    return html;
  }
  function howRu(s) {

  function pstat(t, nick) {

    var fx = function (v, d) { return v == null ? null : Number(v).toFixed(d); };
    return '<span class="pstat">' +
      it("Рейтинг 3.0", fx(h.rating, 2)) +
      it("K/D", fx(h.kd != null ? h.kd : st.kd, 2)) +
      it("ADR", fx(h.adr != null ? h.adr : st.adr, 1)) +
      it("KAST", fx(h.kast != null ? h.kast : st.kast, 1), "%") +

        html += '<blockquote>«' + esc(String(q.ru).replace(/^[«"]|[»"]$/g, "")) + '»' + (q.who ? '<cite>' + esc(q.who) + '</cite>' : '') + '</blockquote>';
      });
      if (!/^https:\/\/t\.me\//.test(n.url || "")) html += '<div class="rd-note">Краткий пересказ статьи. Полный текст — по кнопке ниже.</div>';
    } else {
      html += '<p class="rd-empty">Пересказа этой статьи пока нет: сайт не отдал текст или он ещё в очереди. Можно открыть оригинал.</p>';
    }
    var isTg = /^https:\/\/t\.me\//.test(n.url || "");
    html += (n.url ? '<a class="readbtn" href="' + esc(n.url) + '" ' + (isTg ? 'data-tg' : 'data-read') + '="' + esc(n.url) + '" target="_blank" rel="noopener">' + (isTg ? 'Открыть в Telegram' : 'Открыть оригинал') + '</a>' : '');
    if ((n.also || []).length) {
      html += '<div class="also"><div class="rd-meta">Также писали</div>' + n.also.map(function (a) {
        return '<a href="' + esc(a.url) + '" data-read="' + esc(a.url) + '" target="_blank" rel="noopener"><b>' + esc(a.source) + '</b><span>' + esc(a.title) + '</span></a>';
      }).join("") + '</div>';
    }
    html += '</article></div>';
    return html;
  }

  function keepFilterScroll(render) {
    var saved = {};
    document.querySelectorAll(".filt, .mapsel").forEach(function (el, i) { saved[el.className + i] = el.scrollLeft; });
    render();
    document.querySelectorAll(".filt, .mapsel").forEach(function (el, i) {
      var k = el.className + i;
      if (saved[k] != null) el.scrollLeft = saved[k];
      var sel = el.querySelector('[aria-pressed="true"]');
      if (sel) {
        var l = sel.offsetLeft, r = l + sel.offsetWidth;
        if (l < el.scrollLeft) el.scrollLeft = l - 8;
        else if (r > el.scrollLeft + el.clientWidth) el.scrollLeft = r - el.clientWidth + 8;
      }
    });
  }

  function renderMatch(m) {
    if (state.reader) {
      var n = ((m.news && m.news.items) || []).find(function (x) { return x.key === state.reader; });
      if (n) { $app.innerHTML = readerView(m, n); try { TG && TG.BackButton.show(); } catch (e) {} return; }
      state.reader = null;
    }
    var A = m.teams[0] || {}, B = m.teams[1] || {}, on = mine.has(String(m.id));
    var nCount = ((m.news && m.news.items) || []).length;
    var html = '<div class="view"><div style="padding-top:12px">' + backBtn(m.tournament || "Назад") + '</div>' +
      '<section class="hero"><div class="meta"><span class="pill ' + esc(m.tier) + '">' + esc((m.tier || "").toUpperCase()) + '</span><span>' + esc(m.tournament) + (m.stage ? " · " + esc(m.stage) : "") + '</span></div>' +
      '<div class="face"><div class="tm a"><span class="acr">' + esc(abbr(A)) + '</span><span class="full">' + esc(A.name) + '</span></div>' +
      '<div class="mid"><b>' + esc(hm(m.begin_at)) + '</b>' + esc(dm(m.begin_at)) + ' · BO' + esc(m.bo) + '</div>' +
      '<div class="tm b"><span class="acr">' + esc(abbr(B)) + '</span><span class="full">' + esc(B.name) + '</span></div></div>' +
      '</section>' +
      '<nav class="tabs" role="tablist">' +
      tabBtn("stats", "Статистика") + tabBtn("players", "Игроки") + tabBtn("news", "Новости", nCount) + '</nav><div id="tabbody">';
    if (state.tab === "stats") html += factsBlock(m) + h2hBlock(m) + vetoBlock(m) + mapsBlock(m) + formBlock(m);
    else if (state.tab === "players") html += playersTab(m);
    else html += newsTab(m);
    $app.innerHTML = html + '</div></div>';
    function tabBtn(id, label, c) { return '<button class="tab" role="tab" data-tab="' + id + '" aria-selected="' + (state.tab === id) + '">' + label + (c ? '<span class="c">' + c + '</span>' : '') + '</button>'; }
  }

  // ---------- роутинг: "" турниры, #t-ID турнир, #mine мои матчи, #m-ID матч
  var depth = 0;
  function route() {
    var h = location.hash.replace("#", "");
    var mt = /^m-(\d+)$/.exec(h), tt = /^t-([\w-]+)$/.exec(h);
    try { TG && (h && h !== "feed" && h !== "major" ? TG.BackButton.show() : TG.BackButton.hide()); } catch (e) {}
    if (!state.list) return;
    if (mt) {
      var id = mt[1];
      if (state.openId !== id) { state.openId = id; state.reader = null; state.tab = "stats"; state.newsFilter = "all"; state.map = null; window.scrollTo(0, 0); }
      $app.innerHTML = '<div class="empty">Загружаю матч…</div>';
      getDetail(id).then(renderMatch).catch(function () {
        $app.innerHTML = '<div class="empty"><strong>Подробностей пока нет</strong>Карточки собираются за 3 дня до матча. <button class="chip" id="back" style="margin-top:8px">Назад</button></div>';
      });
      return;
    }
    state.openId = null;
    if (tt) { state.view = "tour:" + tt[1]; renderTour(tt[1]); }
    else if (h === "mine") { state.view = "mine"; renderMine(); }
    else if (h === "major") { location.hash = ""; return; }
    else if (h === "major-disabled") { state.view = "major"; renderMajor(); getMajor().then(function () { if (state.view === "major") renderMajor(); }).catch(function () { if (state.view === "major") $app.innerHTML = homeHeader("major") + '<div class="empty"><strong>Данные по мейджору ещё не собраны</strong>Появятся после ближайшего обновления.</div></div>'; }); }
    else if (h === "feed") { state.view = "feed"; renderFeed(); getFeed().then(function () { if (state.view === "feed") renderFeed(); }).catch(function () { if (state.view === "feed") $app.innerHTML = homeHeader("feed") + '<div class="empty"><strong>Лента пока не собрана</strong>Появится после ближайшего обновления данных.</div></div>'; }); }
    else { state.view = "home"; renderHome(); }
  }
  function rerenderList() {
    if (state.view === "feed") renderFeed();
    else if (state.view === "major") renderMajor();
    else if (state.view === "mine") renderMine();
    else if (state.view && state.view.indexOf("tour:") === 0) renderTour(state.view.slice(5));
    else renderHome();
  }
  function go(hash) { if (location.hash === hash) route(); else { depth++; location.hash = hash; } }
  function closeReader() {
    state.reader = null;
    var fs = state.filtScroll;
    renderMatch(state.details[state.openId]);
    var f = document.querySelector(".filt");
    if (f && fs != null) f.scrollLeft = fs;
    window.scrollTo(0, state.readerScroll || 0);
  }
  function closeFeedReader() {
    state.feedRead = null;
    renderFeed();
    try { TG && TG.BackButton.hide(); } catch (e) {}
    window.scrollTo(0, state.feedScroll || 0);
    var fc = document.querySelector(".feedch"); if (fc) fc.scrollLeft = state.feedChScroll || 0;
  }
  function goBack() {
    if (state.feedRead) { closeFeedReader(); return; }
    if (state.reader) { closeReader(); return; }
    if (depth > 0) { depth--; history.back(); return; }
    var h = location.hash.replace("#", "");
    if (/^m-/.test(h)) {
      var m = (state.list.matches || []).find(function (x) { return "m-" + x.id === h; });
      location.hash = m ? "t-" + tourOf(m) : "";
    } else location.hash = "";
  }
  if (TG) { try { TG.BackButton.onClick(goBack); } catch (e) {} }
  window.addEventListener("hashchange", route);

  // ---------- клики
  $app.addEventListener("click", function (e) {
    var t = e.target.closest("[data-fread],#close-freader,#facts-more,[data-mreg],[data-home],[data-feedch],[data-tg],[data-reader],#close-reader,[data-mine],[data-open],[data-tour],[data-tab],[data-map],[data-nf],[data-player],[data-link],[data-news],[data-orig],[data-read],#back,#to-mine");
    if (!t) return;
    if (t.hasAttribute("data-home")) { var hv = t.getAttribute("data-home"); if (hv === "feed" || hv === "major") { location.hash = hv; } else if (location.hash) { location.hash = ""; } return; }
    if (t.hasAttribute("data-fread")) { state.feedRead = t.getAttribute("data-fread"); state.feedScroll = window.scrollY; var fc = document.querySelector(".feedch"); state.feedChScroll = fc ? fc.scrollLeft : 0; renderFeed(); window.scrollTo(0, 0); return; }
    if (t.id === "close-freader") { closeFeedReader(); return; }
    if (t.id === "facts-more") { state.factsAll = !state.factsAll; renderMatch(state.details[state.openId]); return; }
    if (t.hasAttribute("data-mreg")) { state.majorReg = t.getAttribute("data-mreg"); keepFilterScroll(renderMajor); return; }
    if (t.hasAttribute("data-feedch")) { state.feedCh = t.getAttribute("data-feedch"); keepFilterScroll(renderFeed); return; }
    if (t.hasAttribute("data-tg")) { if (TG) { e.preventDefault(); try { TG.openTelegramLink(t.getAttribute("data-tg")); } catch (x) { openLink(t.getAttribute("data-tg")); } } return; }
    if (t.hasAttribute("data-reader")) { var ff = document.querySelector(".filt"); state.filtScroll = ff ? ff.scrollLeft : null; state.reader = t.getAttribute("data-reader"); state.readerScroll = window.scrollY; renderMatch(state.details[state.openId]); window.scrollTo(0, 0); return; }
    if (t.id === "close-reader") { closeReader(); return; }
    if (t.hasAttribute("data-news")) { var k = t.getAttribute("data-news"); state.openNews = state.openNews === k ? null : k; state.showOrig = null; renderMatch(state.details[state.openId]); var el = document.querySelector('[data-news="' + (window.CSS && CSS.escape ? CSS.escape(k) : k) + '"]'); if (el && state.openNews) el.scrollIntoView({ block: "nearest" }); return; }
    if (t.hasAttribute("data-orig")) { var k2 = t.getAttribute("data-orig"); state.showOrig = state.showOrig === k2 ? null : k2; renderMatch(state.details[state.openId]); return; }
    if (t.hasAttribute("data-read")) { if (TG) { e.preventDefault(); try { TG.openLink(t.getAttribute("data-read"), { try_instant_view: true }); } catch (x) { openLink(t.getAttribute("data-read")); } } return; }
    if (t.hasAttribute("data-link")) { if (TG) { e.preventDefault(); openLink(t.getAttribute("data-link")); } return; }
    if (t.hasAttribute("data-mine")) { e.stopPropagation(); toggleMine(t.getAttribute("data-mine")); state.openId ? renderMatch(state.details[state.openId]) : rerenderList(); return; }
    if (t.hasAttribute("data-open")) { go("#m-" + t.getAttribute("data-open")); return; }
    if (t.hasAttribute("data-tour")) { go("#t-" + t.getAttribute("data-tour")); window.scrollTo(0, 0); return; }
    if (t.id === "to-mine") { go("#mine"); return; }
    if (t.hasAttribute("data-tab")) { state.tab = t.getAttribute("data-tab"); renderMatch(state.details[state.openId]); return; }
    if (t.hasAttribute("data-map")) { state.map = t.getAttribute("data-map"); keepFilterScroll(function () { renderMatch(state.details[state.openId]); }); return; }
    if (t.hasAttribute("data-nf")) { state.openNews = null; state.newsFilter = t.getAttribute("data-nf"); keepFilterScroll(function () { renderMatch(state.details[state.openId]); }); return; }
    if (t.hasAttribute("data-player")) { state.tab = "news"; state.newsFilter = t.getAttribute("data-player"); renderMatch(state.details[state.openId]); window.scrollTo(0, 0); return; }
    if (t.id === "back") { goBack(); return; }
  });
  $app.addEventListener("keydown", function (e) {
    if ((e.key === "Enter" || e.key === " ") && e.target.matches("[data-open]")) { e.preventDefault(); go("#m-" + e.target.getAttribute("data-open")); }
  });

  $app.innerHTML = '<div class="empty">Загружаю матчи…</div>';
  getList().then(function (L) { state.list = L; route(); })
    .catch(function () { $app.innerHTML = '<div class="empty"><strong>Не получилось загрузить матчи</strong>Проверь интернет и открой ещё раз. Если не помогает — сборщик данных ещё ни разу не запускался.</div>'; });
})();
</script>
