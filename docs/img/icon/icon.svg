<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c2230"/>
      <stop offset="1" stop-color="#0d1017"/>
    </linearGradient>
    <linearGradient id="mic" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f3f5f9"/>
      <stop offset="1" stop-color="#c9cfdb"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff5a4f" stop-opacity=".55"/>
      <stop offset="1" stop-color="#ff5a4f" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- микрофон -->
  <g transform="translate(256 214)">
    <rect x="-62" y="-150" width="124" height="196" rx="62" fill="url(#mic)"/>
    <g stroke="#9aa3b5" stroke-width="7" stroke-linecap="round" opacity=".55">
      <line x1="-36" y1="-96" x2="36" y2="-96"/>
      <line x1="-40" y1="-68" x2="40" y2="-68"/>
      <line x1="-40" y1="-40" x2="40" y2="-40"/>
    </g>
    <path d="M -102 -14 a 102 102 0 0 0 204 0" fill="none" stroke="#f3f5f9" stroke-width="22" stroke-linecap="round"/>
    <line x1="0" y1="88" x2="0" y2="128" stroke="#f3f5f9" stroke-width="22" stroke-linecap="round"/>
  </g>
  <!-- лампа «в эфире» -->
  <circle cx="392" cy="112" r="70" fill="url(#glow)"/>
  <circle cx="392" cy="112" r="34" fill="#ff4a3f"/>
  <circle cx="382" cy="102" r="10" fill="#ffffff" opacity=".45"/>
  <!-- CS -->
  <text x="256" y="452" text-anchor="middle" font-family="Unbounded, 'Arial Black', Arial, sans-serif" font-weight="800" font-size="92" letter-spacing="6" fill="#f3f5f9">CS</text>
</svg>
