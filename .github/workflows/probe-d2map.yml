name: probe-d2map
on: { workflow_dispatch: {} }
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python3 tools/probe_d2map.py
        env:
          ODDSPAPI_KEY: ${{ secrets.ODDSPAPI_KEY }}
      - name: push out
        run: |
          cd out && git init -q && git checkout -q -b probe-out && git add -A && git -c user.email=a@b -c user.name=probe commit -qm out && git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" probe-out
