name: probe places
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: probe
        env: { STATS_ONLY: "1" }
        run: |
          cd collector && python - <<'PY'
          import json, collect as c
          for nm in ("Nemiga", "MOUZ", "Natus Vincere"):
              bid = c.team_by_name(nm); hist = c.bo3_history(bid)
              print(nm, bid, len(hist), "tour keys:", sorted((hist[0].get("tournament") or {}).keys())[:25] if hist else None)
              print("  places:", json.dumps(c.bo3_prize_places(bid, hist), ensure_ascii=False))
          print("cache sample:", json.dumps(list(c.bo3_places_cache.items())[:3], ensure_ascii=False)[:800])
          PY
