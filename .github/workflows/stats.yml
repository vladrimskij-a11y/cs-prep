name: Обновить статистику

on:
  schedule:
    - cron: "0,40 */2 * * *"
    - cron: "20 1-23/2 * * *"
    - cron: "7-59/15 * * * *"  # 25.11: в дни тир-1 — раз в 15 мин (в остальные дни такие запуски сразу выходят)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect-stats
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Взять текущие данные (ветка data)
        run: |
          mkdir -p docs/data
          if git fetch -q --depth 1 origin data; then git archive FETCH_HEAD | tar -x -C docs/data; fi

      - name: Нужен ли сбор (частые запуски — только в дни тир-1)
        if: github.event_name == 'schedule' && github.event.schedule == '7-59/15 * * * *'
        run: |
          python - <<'PY'
          import json, os, datetime as dt
          now = dt.datetime.now(dt.timezone.utc)
          try:
              L = json.load(open("docs/data/matches.json"))
          except Exception:
              L = {}
          def t(x):
              try: return dt.datetime.fromisoformat((x or "").replace("Z", "+00:00"))
              except Exception: return None
          hot = any(m.get("tier") == "s" and t(m.get("begin_at")) and abs((t(m["begin_at"]) - now).total_seconds()) < 12 * 3600 for m in L.get("matches") or [])
          if not hot:
              open(os.environ["GITHUB_ENV"], "a").write("SKIP=1\n")
              print("Тир-1 матчей рядом нет — частый запуск пропущен")
          PY

      - name: Восстановить кэш сборщика
        if: env.SKIP != '1'
        uses: actions/cache/restore@v4
        with:
          path: cache
          key: collector-cache-${{ github.run_id }}
          restore-keys: collector-cache-

      - name: Восстановить кэш новостей
        if: env.SKIP != '1'
        uses: actions/cache/restore@v4
        with:
          path: cache_news
          key: news-cache-${{ github.run_id }}
          restore-keys: news-cache-

      - name: Слить кэши
        if: env.SKIP != '1'
        run: python tools/merge_cache.py cache cache_news

      - name: Сбор
        if: env.SKIP != '1'
        env:
          PANDASCORE_TOKEN: ${{ secrets.PANDASCORE_TOKEN }}
          ODDSPAPI_KEY: ${{ secrets.ODDSPAPI_KEY }}
          STATS_ONLY: "1"
        run: python collector/collect.py

      - name: Сохранить кэш сборщика
        if: always() && env.SKIP != '1'
        uses: actions/cache/save@v4
        with:
          path: cache
          key: collector-cache-${{ github.run_id }}

      - name: Сохранить данные (ветка data, слияние с параллельными сборами)
        if: env.SKIP != '1'
        run: python collector/save_data.py stats "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
