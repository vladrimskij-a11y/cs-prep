name: Обновить статистику

on:
  schedule:
    - cron: "0,40 */2 * * *"
    - cron: "20 1-23/2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect-stats
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Взять текущие данные (ветка data)
        run: |
          mkdir -p docs/data
          if git fetch -q --depth 1 origin data; then git archive FETCH_HEAD | tar -x -C docs/data; fi

      - name: Восстановить кэш сборщика
        uses: actions/cache/restore@v4
        with:
          path: cache
          key: collector-cache-${{ github.run_id }}
          restore-keys: collector-cache-

      - name: Восстановить кэш новостей
        uses: actions/cache/restore@v4
        with:
          path: cache_news
          key: news-cache-${{ github.run_id }}
          restore-keys: news-cache-

      - name: Слить кэши
        run: python tools/merge_cache.py cache cache_news

      - name: Сбор
        env:
          PANDASCORE_TOKEN: ${{ secrets.PANDASCORE_TOKEN }}
          ODDSPAPI_KEY: ${{ secrets.ODDSPAPI_KEY }}
          STATS_ONLY: "1"
        run: python collector/collect.py

      - name: Сохранить кэш сборщика
        if: always()
        uses: actions/cache/save@v4
        with:
          path: cache
          key: collector-cache-${{ github.run_id }}

      - name: Сохранить данные (ветка data, слияние с параллельными сборами)
        run: python collector/save_data.py stats "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
