name: probe (временная проверка, только чтение)
on:
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: live PRV–NAVI
        run: |
          python3 - <<'PY'
          import json, urllib.request
          W = "https://rimcs-live.vladrimskij.workers.dev"
          B = "https://api.bo3.gg/api/v1"
          def j(base, p):
              r = urllib.request.Request(base + p, headers={"Origin": "https://vladrimskij-a11y.github.io", "User-Agent": "Mozilla/5.0 rimcs-probe"})
              try: return json.load(urllib.request.urlopen(r, timeout=20))
              except Exception as e: return {"ERR": str(e)}
          x = j(B, "/matches/parivision-vs-natus-vincere-06-11-2026")
          print("MATCH", x.get("team1_score"), x.get("team2_score"), x.get("status"), x.get("parsed_status"), x.get("ERR"))
          g = j(W, f"/games?filter%5Bgames.match_id%5D%5Beq%5D=133052")
          print("GAMES raw", json.dumps(g)[:200] if "results" not in g else len(g["results"]))
          for y in sorted(g.get("results") or [], key=lambda q: q["number"]):
              G = j(W, f"/games/{y['id']}"); ps = j(W, f"/games/{y['id']}/players_stats")
              print("GAME", y["number"], y.get("map_name"), y.get("status"), y.get("winner_clan_name"), y.get("winner_clan_score"), y.get("loser_clan_score"), "rounds", len(G.get("game_rounds") or []), "players", len(ps) if isinstance(ps, list) else ps)
          PY
