name: probe
on: { workflow_dispatch: {} }
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          python3 - <<'X'
          import json, urllib.request
          B = "https://api.bo3.gg/api/v1"
          def get(u):
              r = urllib.request.urlopen(urllib.request.Request(u, headers={"Accept": "application/json", "User-Agent": "Mozilla/5.0"}), timeout=30)
              return json.loads(r.read())
          j = get(f"{B}/tournaments?page[limit]=25&sort=-start_date&filter[tournaments.tier][in]=s,a&filter[tournaments.status][in]=upcoming,current,finished")
          for t in j["results"]:
              print("PR|", t["name"], "| banner", t.get("banner_image_url"), "| img", t.get("image_url"), "| bv", json.dumps(t.get("banner_image_versions"))[:160])
          X
