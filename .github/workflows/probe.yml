name: Проверка источников

on:
  push:
    paths: ["probe/probe.py"]

permissions:
  contents: write
  models: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python probe/probe.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          git config user.name "cs-prep-bot"
          git config user.email "cs-prep-bot@users.noreply.github.com"
          git add probe/out.txt
          git commit -m "Проверка источников: результат" || true
          git pull --rebase -q || true
          git push
