name: probe
on: { workflow_dispatch: {} }
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          python3 - <<'X'
          import json, urllib.request
          B = "https://api.bo3.gg/api/v1"
          def get(u):
              r = urllib.request.urlopen(urllib.request.Request(u, headers={"Accept": "application/json", "User-Agent": "Mozilla/5.0"}), timeout=30)
              return json.loads(r.read())
          for tid in (6132, 4227, 5260, 6010, 6130):
              t = get(f"{B}/tournaments?filter[tournaments.id][eq]={tid}")["results"][0]
              d = get(f"{B}/tournaments/{t['slug']}")
              tm = d.get("teams") or []
              print("PR|", tid, t["name"], "tier", t.get("tier"), "teams", len(tm))
              if tm: print("PR|  ", json.dumps(tm[0])[:300].replace(", ", ","))
          X
