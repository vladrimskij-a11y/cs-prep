name: probe (временная проверка, только чтение)

on:
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet pillow
      - uses: actions/cache/restore@v4
        with:
          path: cache
          key: collector-cache-probe-${{ github.run_id }}
          restore-keys: collector-cache-
      - name: Проверка
        run: |
          mkdir -p docs/data && (git fetch -q --depth 1 origin data && git archive FETCH_HEAD | tar -x -C docs/data) || true
          python - <<'EOF'
          import sys, re, json
          sys.path.insert(0, "collector"); sys.argv = ["probe"]
          import collect as C
          import glob
          for k, v in C.hltv_cache.items():
              if k.startswith("tpl:") or k == "rkpl":
                  for n, x in ((v or {}).get("data") or {}).items(): C.hltv_player_ids.setdefault(n, x)
          for nm in ("PGL Major Singapore 2026 Stage 1", "PGL Major Singapore 2026 Stage 2"):
              ex = (C.hltv_cache.get("event3:" + nm) or {}).get("data") or {}
              print(nm, ex.get("hltv"), "lineups:", list((ex.get("lineups") or {}).keys()))
              for lu in (ex.get("lineups") or {}).values():
                  for p in lu: C.hltv_player_ids.setdefault(C.norm(p["nick"]), {"id": p["id"], "slug": p["slug"]})
          miss = []
          for f in glob.glob("docs/data/match/*.json"):
              d = json.load(open(f))
              for t in d.get("teams") or []:
                  for p in t.get("players") or []:
                      if "majors" not in p and "mvp" not in p:
                          miss.append((t["name"], p.get("nick")))
          print("без данных:", len(miss))
          import collections
          st = collections.Counter()
          for tn, n in sorted(set(miss)):
              pl = C.hltv_player_ids.get(C.norm(n or ""))
              c = C.hltv_cache.get(f"pinfo5:{pl['id']}") if pl else None
              fail = [k for k in C.hltv_cache if pl and k.startswith("hfail:") and f"/player/{pl['id']}/" in k]
              why = "нет id" if not pl else ("кэш " + json.dumps({k: v for k, v in (c.get("data") or {}).items() if k in ("mvp", "majors")}) + " t=" + str(c.get("t"))[:16]) if c else ("пауза" if fail else "нет кэша")
              st[why.split(" ")[0]] += 1
              print("  ", tn, n, pl and pl["id"], why)
          print(dict(st))
          EOF
