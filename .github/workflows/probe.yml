name: probe
on: { workflow_dispatch: {} }
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          python3 - <<'X'
          import re, urllib.request, json
          UA = "cs-prep/1.0 (+https://github.com/vladrimskij-a11y/cs-prep)"
          def get(u):
              try:
                  r = urllib.request.urlopen(urllib.request.Request(u, headers={"User-Agent": UA}), timeout=30)
                  return r.status, r.headers.get("Content-Type"), r.read().decode("utf-8", "replace")
              except Exception as e:
                  return str(e), None, ""
          B = "https://proroles.gamesenselab.pro"
          st, ct, h = get(B + "/")
          sc = re.findall(r"<script(?![^>]*src)[^>]*>(.*?)</script>", h, re.S)
          print("PR| inline scripts", [len(x) for x in sc])
          for x in sc:
              for pat in (r"fetch\(([^)]{0,200})\)", r"['\"`](/[a-z0-9_/\-]*\??[^'\"`]{0,80})['\"`]", r"https?://[^'\"`\s]+"):
                  print("PR| ", pat[:12], list(dict.fromkeys(re.findall(pat, x)))[:25])
          k = h.find("ZywOo"); k = k if k >= 0 else h.lower().find("zywoo")
          print("PR| zywoo at", k, re.sub(r"\s+", " ", h[max(0, k - 600):k + 900]) if k >= 0 else "")
          for path in ("/data.json", "/api/players", "/api/data", "/players.json", "/player/zywoo", "/api/player/zywoo"):
              st, ct, b = get(B + path); print("PR| try", path, st, ct, len(b), re.sub(r"\s+", " ", b[:200]))
          X
