name: probe (временно)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Цены стикеров Сингапура на торговой площадке Steam
        run: |
          python3 - <<'EOF'
          import json, time, urllib.request, urllib.parse
          UA = {"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126 Safari/537.36"}
          def get(u):
              try:
                  r = urllib.request.urlopen(urllib.request.Request(u, headers=UA), timeout=30)
                  return r.status, r.read().decode("utf-8", "replace")
              except urllib.error.HTTPError as e:
                  return e.code, ""
          q = urllib.parse.urlencode({"query": "Singapore 2026", "appid": 730, "norender": 1, "count": 30, "sort_column": "quantity", "sort_dir": "desc"})
          st, body = get("https://steamcommunity.com/market/search/render/?" + q)
          print("поиск: HTTP", st)
          if st == 429:
              time.sleep(60)
              st, body = get("https://steamcommunity.com/market/search/render/?" + q)
              print("поиск через минуту: HTTP", st)
          if st != 200:
              time.sleep(5)
              st2, b2 = get("https://steamcommunity.com/market/priceoverview/?appid=730&currency=5&market_hash_name=" + urllib.parse.quote("Austin 2025 Legends Sticker Capsule"))
              print("цена одной капсулы (Остин, для сравнения): HTTP", st2, b2)
          items = (json.loads(body) if body else {}).get("results") or []
          print("найдено всего:", (json.loads(body) if body else {}).get("total_count"))
          for x in items[:30]:
              print(f'{x.get("sell_listings"):>8} лотов  {x.get("sell_price_text"):>8}  {x.get("hash_name")}')
          caps = [x["hash_name"] for x in items if "Capsule" in x["hash_name"]][:2] or [x["hash_name"] for x in items[:2]]
          for n in caps:
              time.sleep(4)
              st, body = get("https://steamcommunity.com/market/priceoverview/?" + urllib.parse.urlencode({"appid": 730, "currency": 5, "market_hash_name": n}))
              print("цена:", n, "HTTP", st, body)
          EOF
