name: probe
on: { workflow_dispatch: {} }
jobs:
  p:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - run: |
          pip install -q demoparser2 pandas
          python3 - <<'X'
          import json, urllib.request, time, os, subprocess
          B = "https://api.bo3.gg/api/v1"
          def get(u):
              return json.loads(urllib.request.urlopen(urllib.request.Request(u, headers={"Accept": "application/json", "User-Agent": "Mozilla/5.0"}), timeout=30).read())
          j = get(f"{B}/games?filter[games.match_id][eq]=132254")
          g = sorted(j["results"], key=lambda x: x.get("number") or 0)[0]
          print("POS| game", g["id"], g.get("map_name"), "demo_url:", g.get("demo_url"))
          rel = g.get("demo_url")
          if not rel:
              raise SystemExit
          url = None
          for base in ("https://files.bo3.gg/", "https://demos.bo3.gg/", "https://bo3.gg/", "https://storage.bo3.gg/", "https://cdn.bo3.gg/", "https://files.bo3.gg/uploads/"):
              try:
                  r = urllib.request.urlopen(urllib.request.Request(base + rel, method="HEAD", headers={"User-Agent": "Mozilla/5.0"}), timeout=20)
                  print("POS| OK", base, r.status, r.headers.get("Content-Length"), r.headers.get("Content-Type"))
                  url = url or base + rel
              except Exception as e:
                  print("POS| нет", base, e)
          if not url:
              raise SystemExit
          t = time.time()
          urllib.request.urlretrieve(url, "d.bin")
          print("POS| скачано", os.path.getsize("d.bin") // 1048576, "МБ за", round(time.time() - t), "с")
          head = open("d.bin", "rb").read(8)
          print("POS| head", head)
          f = "d.bin"
          if head[:2] == b"BZ":
              subprocess.run("bunzip2 -c d.bin > d.dem", shell=True); f = "d.dem"
          elif head[:4] == b"PK\x03\x04":
              subprocess.run("unzip -o -q d.bin && ls -la", shell=True)
              f = next(x for x in os.listdir(".") if x.endswith(".dem"))
          elif head[:2] == b"\x1f\x8b":
              subprocess.run("gunzip -c d.bin > d.dem", shell=True); f = "d.dem"
          from demoparser2 import DemoParser
          t = time.time()
          p = DemoParser(f)
          fe = p.parse_event("round_freeze_end")
          ticks = [int(x) + 64 * 20 for x in fe["tick"].tolist()]
          df = p.parse_ticks(["last_place_name", "team_num", "name"], ticks=ticks)
          print("POS| разбор", round(time.time() - t), "с; раундов", len(ticks))
          for name, grp in df.groupby("name"):
              for side, g2 in grp.groupby("team_num"):
                  top = g2["last_place_name"].value_counts().head(3)
                  print("POS|", name, "CT" if side == 3 else "T", dict(top))
          X
