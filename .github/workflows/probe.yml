name: probe (временно)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Liquipedia — где Anlelele на странице Astralis (один запрос)
        run: |
          curl -s --compressed -A "cs-prep/1.0 (https://github.com/vladrimskij-a11y/cs-prep; cs-prep-bot@users.noreply.github.com)" \
            "https://liquipedia.net/counterstrike/api.php?action=query&prop=revisions&rvprop=content&rvslots=main&format=json&formatversion=2&titles=Astralis" -o a.json
          python3 - <<'EOF'
          import json, re
          t = json.load(open("a.json"))["query"]["pages"][0]["revisions"][0]["slots"]["main"]["content"]
          for m in re.finditer(r"\{\{Squad[^\n]*", t):
              print("БЛОК:", m.group(0)[:120])
          for ln in t.split("\n"):
              if re.search(r"anlelele|jabbi|siuhy|Stand-in|loan", ln, re.I):
                  print("СТРОКА:", ln[:300])
          EOF
