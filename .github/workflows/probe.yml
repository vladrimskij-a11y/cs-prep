name: probe (временная проверка, только чтение)

on:
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet pillow
      - uses: actions/cache/restore@v4
        with:
          path: cache
          key: collector-cache-probe-${{ github.run_id }}
          restore-keys: collector-cache-
      - name: Проверка
        run: |
          mkdir -p docs/data && (git fetch -q --depth 1 origin data && git archive FETCH_HEAD | tar -x -C docs/data) || true
          python - <<'EOF'
          import sys, re, json
          sys.path.insert(0, "collector"); sys.argv = ["probe"]
          import collect as C
          for t in ({"name": "FUT Esports", "acronym": "FUT"}, {"name": "NIP", "acronym": "NIP"}, {"name": "Spirit", "acronym": "TS"}):
              print("алиасы", t["name"], C.team_aliases(t, C.hltv_team_for(t)))
              ms = C.team_veto_matches(t, C.hltv_team_for(t))
              print("  матчей в архиве:", len(ms), [m.get("slug") for m in ms[:4]])
              v = C.build_veto([t, {"name": "Vitality", "acronym": "VIT"}])
              print("  вето:", [(x or {}).get("matches") for x in (v or {}).get("teams", [])], json.dumps((v or {}).get("teams", [None])[0], ensure_ascii=False)[:200])
          d = json.load(open([f for f in __import__("glob").glob("docs/data/match/*.json") if "FUT" in open(f).read()][0]))
          print("карточка TS vs FUT updated:", d.get("updated"), [bool(x) for x in (d.get("veto") or {}).get("teams", [])])
          EOF
