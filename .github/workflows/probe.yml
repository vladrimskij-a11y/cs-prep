name: probe
on: { workflow_dispatch: {} }
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - env:
          T: ${{ secrets.PANDASCORE_TOKEN }}
        run: |
          python3 - <<'X'
          import json, os, urllib.request
          def get(u, h={}):
              r = urllib.request.urlopen(urllib.request.Request(u, headers={"Accept": "application/json", "User-Agent": "Mozilla/5.0", **h}), timeout=30)
              return json.loads(r.read())
          H = {"Authorization": "Bearer " + os.environ["T"]}
          for path in ("running", "upcoming"):
              for t in get(f"https://api.pandascore.co/csgo/tournaments/{path}?per_page=100", H):
                  if (t.get("tier") or "").lower() not in ("s", "a"): continue
                  tm = t.get("teams")
                  print("PR: PS", path, t.get("tier"), (t.get("league") or {}).get("name"), (t.get("serie") or {}).get("full_name"), "|", t.get("name"), "| teams", None if tm is None else len(tm), [x.get("name") for x in (tm or [])][:4], "| serie", t.get("serie_id"))
          j = get("https://api.bo3.gg/api/v1/tournaments?page[limit]=30&sort=start_date&filter[tournaments.tier][in]=a,s&filter[tournaments.status][in]=upcoming,current")
          for t in j.get("results") or []:
              print("PR: BO3", t.get("tier"), t.get("name"), t.get("start_date", "")[:10], "keys", [k for k in t if "team" in k])
          X
