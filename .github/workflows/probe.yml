name: probe
on: { workflow_dispatch: {} }
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          python3 - <<'X'
          import re, time, urllib.request
          UA = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36"
          def get(p):
              time.sleep(1.2)
              try:
                  r = urllib.request.urlopen(urllib.request.Request("https://www.dust2.us" + p, headers={"User-Agent": UA, "Accept": "text/html", "Accept-Language": "en-US,en;q=0.9"}), timeout=40)
                  return r.status, r.read().decode("utf-8", "replace")
              except Exception as e:
                  return str(e), ""
          def ids_of(p):
              st, h = get(p)
              ids = sorted({int(x) for x in re.findall(r'href="/matches/(\d+)/', h)})
              ev = re.findall(r'href="(/events/\d+/[^"]+)"', h)
              print("PR|", p, st, "n", len(ids), "min", ids[:1], "max", ids[-1:], "events", ev[:2])
              return h
          h = ids_of("/results")
          ids_of("/results?startDate=2026-05-01&endDate=2026-05-31")
          ids_of("/results?team=4608")
          ids_of("/results?offset=400")
          ev = re.findall(r'href="/events/(\d+)/([^"]+)"', h)
          if ev:
              eid, sl = ev[-1]
              ids_of(f"/results?event={eid}")
              ids_of(f"/events/{eid}/{sl}")
          for q in ("/events/archive", "/events", "/results/archive"):
              ids_of(q)
          X
