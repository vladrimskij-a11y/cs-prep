name: probe
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q -r collector/requirements.txt 2>/dev/null || pip install -q requests pillow beautifulsoup4 lxml
      - run: |
          mkdir -p docs/data
          git fetch -q --depth 1 origin data && git archive FETCH_HEAD | tar -x -C docs/data
      - uses: actions/cache/restore@v4
        with:
          path: cache
          key: collector-cache-${{ github.run_id }}
          restore-keys: collector-cache-
      - run: python3 tools/probe_vrsfit.py
