name: probe
on: { workflow_dispatch: {} }
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - env:
          K: ${{ secrets.GEMINI_KEY }}
        run: |
          python3 - <<'X'
          import json, os, urllib.request, urllib.error
          H = {"Content-Type": "application/json", "x-goog-api-key": os.environ["K"]}
          j = json.loads(urllib.request.urlopen(urllib.request.Request("https://generativelanguage.googleapis.com/v1beta/models?pageSize=200", headers=H), timeout=60).read())
          names = [m["name"].split("/")[-1] for m in j.get("models", []) if "generateContent" in m.get("supportedGenerationMethods", [])]
          print("GEM| models", " ".join(n for n in names if "flash" in n or "lite" in n))
          def call(m, think):
              cfg = {"maxOutputTokens": 40}
              if think is not None: cfg["thinkingConfig"] = {"thinkingBudget": think}
              body = {"contents": [{"role": "user", "parts": [{"text": "Ответь одним словом: столица Франции?"}]}], "generationConfig": cfg}
              req = urllib.request.Request(f"https://generativelanguage.googleapis.com/v1beta/models/{m}:generateContent", data=json.dumps(body).encode(), headers=H, method="POST")
              try:
                  r = json.loads(urllib.request.urlopen(req, timeout=60).read())
                  return "OK " + r["candidates"][0]["content"]["parts"][0]["text"].strip()[:20]
              except urllib.error.HTTPError as e:
                  return f"HTTP {e.code} " + e.read()[:160].decode("utf-8", "replace").replace("\n", " ")
          for m in ["gemini-flash-lite-latest"] + [n for n in names if "lite" in n][:4]:
              print("GEM|", m, "think0:", call(m, 0)[:90], "| nothink:", call(m, None)[:90])
          X
