name: probe
on:
  push:
    paths: [".github/workflows/probe.yml", "tools/probe_hist.py"]
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install --quiet trafilatura pillow
      - run: python tools/probe_hist.py
