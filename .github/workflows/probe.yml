name: probe
on: { workflow_dispatch: {} }
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir w && cd w
          npm pack hltv >/dev/null 2>&1 && tar -xzf hltv-*.tgz
          git clone -q --depth 1 https://github.com/M3MONs/hltv-scraper-api m3
          git clone -q --depth 1 https://github.com/gigobyte/HLTV gg || true
          grep -rl -i "achievement-table\|achievementTable" --include=*.html --include=*.htm --include=*.txt --include=*.json . 2>/dev/null | head | sed 's/^/FIX| /'
          f=$(grep -rl "achievement-table" --include=*.html . 2>/dev/null | head -1)
          if [ -n "$f" ]; then python3 -c "
          import re,sys;b=re.sub(r'\s+',' ',open('$f',encoding='utf-8',errors='replace').read());k=b.find('achievement-table');print('FIX| SNIP', b[k-300:k+2500])"; fi
          grep -rn -i "major" m3/hltv_scraper/hltv_scraper/spiders/parsers/*.py | head -20 | sed 's/^/FIX| /'
          grep -rn "achievement" gg/src 2>/dev/null | head -20 | sed 's/^/FIX| /'
