name: probe (временно)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Кэш сборщика
        uses: actions/cache/restore@v4
        with:
          path: cache
          key: collector-cache-probe-${{ github.run_id }}
          restore-keys: collector-cache-
      - name: Запись event3 BLAST в кэше
        run: |
          python3 - <<'EOF'
          import json
          c = json.load(open("cache/hltv.json"))
          for k, v in c.items():
              if k.startswith("event3:") and "BLAST" in k:
                  d = v.get("data") or {}
                  print(k, "t=", v.get("t"), "tbd2=", v.get("tbd2"), "teams=", len(d.get("teams") or []))
              if k.startswith("hfail:") and "8295" in k:
                  print(k, v)
          EOF
      - name: Страница события HLTV (один запрос)
        run: |
          curl -s -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126 Safari/537.36" \
            -H "Accept: text/html" -H "Accept-Language: en-US,en;q=0.9" -o ev.html -w "HTTP %{http_code}\n" \
            https://www.hltv.org/events/8295/blast-bounty-2027-season-1
          python3 - <<'EOF'
          import re
          b = re.sub(r">\s+<", "><", open("ev.html", encoding="utf-8", errors="replace").read())
          print("team-name:", b.count('class="team-name"'), "team-box:", b.count("team-box"), "TBD:", b.count("TBD"))
          for m in list(re.finditer(r"TBD", b))[:6]:
              print("----TBD----"); print(b[max(0, m.start() - 900):m.start() + 500])
          i = b.find('class="team-name"')
          print("----first team-name----"); print(b[i - 300:i + 900])
          EOF
