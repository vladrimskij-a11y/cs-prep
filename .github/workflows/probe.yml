name: probe
on: { workflow_dispatch: {} }
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          python3 - <<'X'
          import json, urllib.request
          B = "https://api.bo3.gg/api/v1"
          def get(u):
              r = urllib.request.urlopen(urllib.request.Request(u, headers={"Accept": "application/json", "User-Agent": "Mozilla/5.0"}), timeout=30)
              return json.loads(r.read())
          for mid in (132254, 132200):
              try:
                  m = get(f"{B}/matches?filter[matches.id][eq]={mid}")["results"][0]
                  d = get(f"{B}/matches/{m['slug']}")
                  print("PR:", mid, m["slug"], "t1", d.get("team1_id"), "t2", d.get("team2_id"))
                  print("PR: MM", json.dumps(d.get("match_maps"))[:1500])
              except Exception as e:
                  print("PR: ERR", mid, e)
          X
