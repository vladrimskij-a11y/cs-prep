name: probe
on: { workflow_dispatch: {} }
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          python3 - <<'X'
          import re, urllib.request, json
          UA = "cs-prep/1.0 (+https://github.com/vladrimskij-a11y/cs-prep)"
          def get(u):
              try:
                  r = urllib.request.urlopen(urllib.request.Request(u, headers={"User-Agent": UA}), timeout=30)
                  return r.status, r.headers.get("Content-Type"), r.read().decode("utf-8", "replace")
              except Exception as e:
                  return str(e), None, ""
          B = "https://proroles.gamesenselab.pro"
          st, ct, h = get(B + "/")
          sc = re.findall(r"<script(?![^>]*src)[^>]*>(.*?)</script>", h, re.S)
          x = max(sc, key=len)
          print("PR| HEAD", re.sub(r"\s+", " ", x[:2500]))
          for m in re.finditer(r"(?:const|let|var)\s+(\w+)\s*=", x):
              print("PR| VAR", m.group(1), m.start(), re.sub(r"\s+", " ", x[m.end():m.end()+160]))
          k = x.find("ZywOo"); k = k if k >= 0 else x.lower().find("zywoo")
          print("PR| ZY", k, re.sub(r"\s+", " ", x[max(0,k-1500):k+1500]))
          print("PR| TAIL", re.sub(r"\s+", " ", x[-2500:]))
          X
