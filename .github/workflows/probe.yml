name: probe
on: { workflow_dispatch: {} }
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - env:
          K: ${{ secrets.GEMINI_KEY }}
        run: |
          python3 - <<'X'
          import json, os, urllib.request, urllib.error
          for m in ("gemini-flash-latest", "gemini-flash-lite-latest", "gemini-2.5-flash-lite"):
              body = {"contents": [{"role": "user", "parts": [{"text": "Ответь одним словом: столица Франции?"}]}],
                      "generationConfig": {"maxOutputTokens": 20, "thinkingConfig": {"thinkingBudget": 0}}}
              req = urllib.request.Request(f"https://generativelanguage.googleapis.com/v1beta/models/{m}:generateContent", data=json.dumps(body).encode(),
                                           headers={"Content-Type": "application/json", "x-goog-api-key": os.environ["K"]}, method="POST")
              try:
                  j = json.loads(urllib.request.urlopen(req, timeout=60).read())
                  print("GEM|", m, "OK", j["candidates"][0]["content"]["parts"][0]["text"].strip()[:30])
              except urllib.error.HTTPError as e:
                  print("GEM|", m, "HTTP", e.code, e.read()[:120].decode("utf-8", "replace").replace("\n", " "))
          X
