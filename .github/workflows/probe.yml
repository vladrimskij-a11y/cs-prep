name: probe (временная проверка, только чтение)
on:
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: поиск поста
        run: |
          python3 - <<'PY'
          import re, time, html, urllib.request, urllib.parse
          for ch in ["cs3news", "retakenews", "raiznews", "newcsgo", "m0NESYGG"]:
              for q in ["штраф", "колу", "кола"]:
                  u = f"https://t.me/s/{ch}?q=" + urllib.parse.quote(q)
                  try:
                      h = urllib.request.urlopen(urllib.request.Request(u, headers={"User-Agent": "Mozilla/5.0"}), timeout=20).read().decode("utf-8", "replace")
                  except Exception as e:
                      print(ch, q, "ERR", e); continue
                  for blk in h.split('class="tgme_widget_message_wrap')[1:]:
                      pm = re.search(r'data-post="([^"]+)"', blk); dt = re.search(r'datetime="([^"]+)"', blk)
                      tm = re.search(r'<div class="tgme_widget_message_text[^>]*>(.*?)</div>', blk, re.S)
                      t = re.sub(r"\s+", " ", html.unescape(re.sub(r"<[^>]+>", " ", tm.group(1)))).strip() if tm else ""
                      if dt and dt.group(1) >= "2026-10-30":
                          print("POST", pm.group(1) if pm else "?", dt.group(1)[:16], "|", t[:300])
                  time.sleep(1)
          PY
