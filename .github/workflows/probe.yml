name: probe
on: { workflow_dispatch: {} }
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: |
          mkdir -p docs/data
          python -c "import sys; sys.path.insert(0,'collector'); import collect; collect.build_positions()"
          ls -la docs/data
      - uses: actions/upload-artifact@v4
        with: { name: pos, path: docs/data/positions.json }
