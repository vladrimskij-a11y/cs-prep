name: probe
on: { workflow_dispatch: {} }
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          python3 - <<'X'
          import re, time, urllib.request
          UA = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36"
          def get(p):
              time.sleep(1.2)
              try:
                  r = urllib.request.urlopen(urllib.request.Request("https://www.dust2.us" + p, headers={"User-Agent": UA, "Accept": "text/html", "Accept-Language": "en-US,en;q=0.9"}), timeout=40)
                  return r.status, r.read().decode("utf-8", "replace")
              except Exception as e:
                  return str(e), ""
          st, h = get("/results")
          b = re.sub(r"\s+", " ", h)
          ids = [int(x) for x in re.findall(r'href="/matches/(\d+)/', b)]
          print("PR| ids", len(ids), "min", min(ids), "max", max(ids), "uniq", len(set(ids)))
          cls = re.findall(r'class="([^"]*(?:date|time|day|group)[^"]*)"', b)
          from collections import Counter
          print("PR| classes", Counter(cls).most_common(15))
          print("PR| unix", len(re.findall(r'data-unix', b)), "zoned", len(re.findall(r'data-zonedgrouping', b)))
          for k in (100, 1700):
              m = list(re.finditer(r'href="/matches/(\d+)/', b))[k]
              print("PR| row", k, b[m.start() - 1200:m.start() + 300].replace('"PR', ''))
          for pat in (r'Results for [^<]{3,40}', r'\b(?:January|February|March|April|May|June|July|August|September|October|November|December) \d{1,2}\w* \d{4}'):
              f = re.findall(pat, b); print("PR| pat", pat[:20], len(f), f[:1], f[-1:])
          X
