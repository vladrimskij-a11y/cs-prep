name: probe (временная проверка, только чтение)
on:
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: live PRV–NAVI raw
        run: |
          python3 - <<'PY'
          import json, urllib.request
          W = "https://rimcs-live.vladrimskij.workers.dev"
          B = "https://api.bo3.gg/api/v1"
          def j(base, p):
              r = urllib.request.Request(base + p, headers={"Origin": "https://vladrimskij-a11y.github.io", "User-Agent": "Mozilla/5.0 rimcs-probe"})
              try: return json.load(urllib.request.urlopen(r, timeout=20))
              except Exception as e: return {"ERR": str(e)}
          m = j(W, "/matches?page%5Blimit%5D=10&filter%5Bmatches.status%5D%5Bin%5D=current&filter%5Bmatches.team_ids%5D%5Boverlap%5D=8171")
          for x in m.get("results") or []:
              print("MATCH keys:", sorted(x.keys()))
              print("MATCH score", x.get("team1_score"), x.get("team2_score"), x.get("status"), x.get("slug"))
              g = j(W, f"/games?filter%5Bgames.match_id%5D%5Beq%5D={x['id']}")
              for y in g.get("results") or []:
                  print("GAME", y.get("id"), y.get("number"), y.get("map_name"), y.get("status"), "| keys:", sorted(y.keys()))
                  print("   ", {k: y.get(k) for k in y if "score" in k or "round" in k or "clan" in k or "state" in k})
                  if y.get("status") != "upcoming" or y.get("number") == 1:
                      G = j(W, f"/games/{y['id']}")
                      print("   GAME DETAIL keys:", sorted(G.keys()) if isinstance(G, dict) else type(G))
                      print("   rounds:", len(G.get("game_rounds") or []) if isinstance(G, dict) else None, {k: G.get(k) for k in (G if isinstance(G, dict) else {}) if "score" in k or "round" in k})
                      ps = j(W, f"/games/{y['id']}/players_stats")
                      print("   players_stats:", (len(ps) if isinstance(ps, list) else json.dumps(ps)[:200]))
                      for path in (f"/games/{y['id']}/rounds", f"/games/{y['id']}?with=game_rounds", f"/matches/{x['slug']}"):
                          r = j(B, path)
                          print("   bo3 direct", path, json.dumps(r)[:400])
          PY
