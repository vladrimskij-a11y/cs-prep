name: probe (временная проверка, только чтение)
on:
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: текст поста
        run: |
          python3 - <<'PY'
          import re, html, urllib.request
          h = urllib.request.urlopen(urllib.request.Request("https://t.me/s/cs3news?before=19546", headers={"User-Agent": "Mozilla/5.0"}), timeout=20).read().decode("utf-8", "replace")
          for blk in h.split('class="tgme_widget_message_wrap')[1:]:
              if 'data-post="cs3news/19545"' in blk:
                  tm = re.search(r'<div class="tgme_widget_message_text[^>]*>(.*?)</div>', blk, re.S)
                  print("TEXT", re.sub(r"\s+", " ", html.unescape(re.sub(r"<[^>]+>", " ", tm.group(1)))) if tm else "нет текста")
          PY
