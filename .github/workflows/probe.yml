name: probe
on: { workflow_dispatch: {} }
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir w && cd w
          npm pack hltv >/dev/null 2>&1 && tar -xzf hltv-*.tgz && echo "SRC| hltv npm ok"
          git clone -q --depth 1 https://github.com/M3MONs/hltv-scraper-api m3 && echo "SRC| m3 ok"
          git clone -q --depth 1 https://github.com/Gabrielcnetto/HLTV-api go && echo "SRC| go ok"
          sed -n '90,135p' package/lib/endpoints/getPlayer.js | sed 's/^/SRC| /'
          cat m3/hltv_scraper/hltv_scraper/spiders/parsers/player_profile_trophies.py | sed 's/^/SRC| /'
          grep -n -i -B2 -A6 "trophy\|achiev" m3/hltv_scraper/hltv_scraper/spiders/parsers/team_profile.py | head -40 | sed 's/^/SRC| /'
