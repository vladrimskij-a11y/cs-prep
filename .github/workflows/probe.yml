name: probe
on: { workflow_dispatch: {} }
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          U="https://rimcs-live.vladrimskij.workers.dev"
          curl -s -D - "$U/matches?page%5Blimit%5D=1&filter%5Bmatches.status%5D%5Bin%5D=current" -H "Origin: https://vladrimskij-a11y.github.io" | head -c 700 | sed 's/^/PR: /'
          echo; curl -s -o /dev/null -w "PR: other path %{http_code}\n" "$U/users"
          curl -s -D - -X OPTIONS "$U/games" -H "Origin: https://vladrimskij-a11y.github.io" -H "Access-Control-Request-Method: GET" | head -c 300 | sed 's/^/PR: /'
