name: probe (временно)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Кэш сборщика
        uses: actions/cache/restore@v4
        with:
          path: cache
          key: collector-cache-probe-${{ github.run_id }}
          restore-keys: collector-cache-
      - name: Составы стадий мейджора из кэша HLTV (без запросов)
        run: |
          python3 - <<'EOF'
          import json
          c = json.load(open("cache/hltv.json"))
          for k, v in c.items():
              if k.startswith("event3:") and "Singapore" in k:
                  lu = (v.get("data") or {}).get("lineups") or {}
                  print(k, v.get("t"), "составов:", len(lu))
                  for tn, pl in lu.items():
                      if len(pl) != 5 or tn.lower() in ("astralis", "heroic"):
                          print("   ", tn, [p["nick"] for p in pl])
          EOF
