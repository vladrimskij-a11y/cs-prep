name: probe
on: { workflow_dispatch: {} }
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          pip install -q pyflakes
          python -m pyflakes collector/*.py | grep -v "imported but unused" | sed 's/^/LINT| /' || true
          echo "LINT| done"
