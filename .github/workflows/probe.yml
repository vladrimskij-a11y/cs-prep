name: probe (временная проверка, только чтение)
on:
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: live PRV–NAVI
        run: |
          python3 - <<'PY'
          import json, urllib.request
          W = "https://rimcs-live.vladrimskij.workers.dev"
          def j(p):
              r = urllib.request.Request(W + p, headers={"Origin": "https://vladrimskij-a11y.github.io", "User-Agent": "rimcs-probe"})
              return json.load(urllib.request.urlopen(r, timeout=20))
          m = j("/matches?page%5Blimit%5D=10&filter%5Bmatches.status%5D%5Bin%5D=current,finished&filter%5Bmatches.team_ids%5D%5Boverlap%5D=8171")
          for x in m.get("results") or []:
              if 787 not in (x.get("team1_id"), x.get("team2_id")): continue
              print("MATCH", x.get("team1_score"), x.get("team2_score"), x.get("status"), x.get("parsed_status"))
              for y in sorted(j(f"/games?filter%5Bgames.match_id%5D%5Beq%5D={x['id']}").get("results") or [], key=lambda g: g["number"]):
                  G = j(f"/games/{y['id']}")
                  ps = j(f"/games/{y['id']}/players_stats")
                  print("GAME", y["number"], y.get("map_name"), y.get("status"), y.get("winner_clan_name"), y.get("winner_clan_score"), y.get("loser_clan_score"), "rounds", len(G.get("game_rounds") or []), "players", len(ps))
          PY
