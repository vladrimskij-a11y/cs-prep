name: probe
on: { workflow_dispatch: {} }
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          python3 - <<'X'
          import re, urllib.request, json
          UA = "cs-prep/1.0 (+https://github.com/vladrimskij-a11y/cs-prep)"
          def get(u):
              try:
                  r = urllib.request.urlopen(urllib.request.Request(u, headers={"User-Agent": UA}), timeout=30)
                  return r.status, r.headers.get("Content-Type"), r.read().decode("utf-8", "replace")
              except Exception as e:
                  return str(e), None, ""
          B = "https://proroles.gamesenselab.pro"
          st, ct, rb = get(B + "/robots.txt"); print("PR| robots", st); [print("PR|  ", l) for l in rb.splitlines()[:30]]
          st, ct, h = get(B + "/"); print("PR| main", st, ct, len(h))
          for pat in (r'<script[^>]+src="([^"]+)"', r'fetch\(["\']([^"\']+)', r'["\'](/api/[^"\']+)', r'["\']([^"\']+\.json)["\']', r'(terms|privacy|tos)[^"\']*'):
              print("PR| pat", pat[:20], list(dict.fromkeys(re.findall(pat, h, re.I)))[:15])
          print("PR| snippet", re.sub(r"\s+", " ", h)[:1500])
          for s in list(dict.fromkeys(re.findall(r'<script[^>]+src="([^"]+)"', h)))[:6]:
              u = s if s.startswith("http") else B + ("" if s.startswith("/") else "/") + s
              st, ct, js = get(u)
              apis = list(dict.fromkeys(re.findall(r'["\'`](/api/[^"\'`]+|https?://[^"\'`]+/api[^"\'`]*|[^"\'`]*\.json)["\'`]', js)))[:20]
              print("PR| js", u, st, len(js), apis)
          X
