name: probe (временная проверка, только чтение)
on:
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: live PRV–NAVI raw
        run: |
          python3 - <<'PY'
          import json, urllib.request
          W = "https://rimcs-live.vladrimskij.workers.dev"
          B = "https://api.bo3.gg/api/v1"
          def j(base, p):
              r = urllib.request.Request(base + p, headers={"Origin": "https://vladrimskij-a11y.github.io", "User-Agent": "Mozilla/5.0 rimcs-probe"})
              try: return json.load(urllib.request.urlopen(r, timeout=20))
              except Exception as e: return {"ERR": str(e)}
          x = j(B, "/matches/parivision-vs-natus-vincere-06-11-2026")
          print("FIELDS", {k: x.get(k) for k in ("parsed_status", "live_coverage", "live_coverage_source", "live_coverage_advantage", "live_updates", "team1_last_game_score", "team2_last_game_score", "maps_score", "status")})
          # для сравнения — другой идущий матч, где bo3 ведёт live
          cur = j(B, "/matches?page%5Blimit%5D=20&filter%5Bmatches.status%5D%5Bin%5D=current")
          for y in cur.get("results") or []:
              print("CUR", y.get("slug"), {k: y.get(k) for k in ("parsed_status", "live_coverage", "live_coverage_source", "team1_last_game_score", "team2_last_game_score")})
          lu = x.get("live_updates")
          print("LIVE_UPDATES", json.dumps(lu)[:1500] if lu else lu)
          PY
