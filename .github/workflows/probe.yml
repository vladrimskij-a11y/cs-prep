name: probe
on: { workflow_dispatch: {} }
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          python3 - <<'X'
          import json, urllib.request, re, time
          def g(u, h=None):
              return urllib.request.urlopen(urllib.request.Request(u, headers=h or {"User-Agent": "cs-prep/1.0", "Accept": "application/json"}), timeout=30).read().decode()
          d = json.loads(g("https://api.bo3.gg/api/v1/matches?page[limit]=30&sort=start_date&filter[matches.status][in]=upcoming&filter[matches.tier][in]=s"))
          for m in d.get("results") or []:
              if not m.get("team1_id") or not m.get("team2_id"):
                  print("PR| M", m.get("slug"), {k: v for k, v in m.items() if k not in ("bet_updates",) and not isinstance(v, (list, dict))})
                  print("PR| D", {k: v for k, v in m.items() if isinstance(v, (list, dict)) and k != "bet_updates"})
                  break
          UA = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36"
          h = re.sub(r"\s+", " ", g("https://www.dust2.us/matches", {"User-Agent": UA}))
          i = h.find("parivision-navi-winner")
          j = h.find("match-list-component", i - 4000)
          print("PR| D2", h[i-200:i+2500])
          X
