name: probe
on: { workflow_dispatch: {} }
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          U="https://rimcs-live.vladrimskij.workers.dev"
          curl -s -o /tmp/a -w "PR: players_stats %{http_code}\n" "$U/games/192645/players_stats" -H "Origin: https://vladrimskij-a11y.github.io"
          head -c 200 /tmp/a | sed 's/^/PR: /'; echo
          curl -s -o /dev/null -w "PR: users %{http_code}\n" "$U/users"
