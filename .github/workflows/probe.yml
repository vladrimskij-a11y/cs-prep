name: probe
on: { workflow_dispatch: {} }
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p docs/data && git fetch -q --depth 1 origin data && git archive FETCH_HEAD | tar -x -C docs/data
          STATS_ONLY=1 python3 - <<'X'
          import sys, json, re
          sys.path.insert(0, "collector")
          import collect as c
          h = c.d2_get("/results") or ""
          b = re.sub(r"\s+", " ", h)
          i = b.find('class="match-date"')
          print("PR| feed-date", b[i - 300:i + 400].replace('"PR', ''))
          m = c.d2_get("/matches/2400004/natus-vincere-vs-falcons") or ""
          m = re.sub(r"\s+", " ", m)
          for pat in (r'data-unix="\d+"', r'class="[^"]*date[^"]*"[^>]*>[^<]{0,40}', r'class="[^"]*time[^"]*"[^>]*>[^<]{0,40}', r'\d{1,2}(?:st|nd|rd|th)? of \w+ \d{4}', r'datetime="[^"]+"'):
              print("PR| page", pat[:25], re.findall(pat, m)[:3])
          X
