name: probe
on: { workflow_dispatch: {} }
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p docs/data && git fetch -q --depth 1 origin data && git archive FETCH_HEAD | tar -x -C docs/data
          STATS_ONLY=1 python3 - <<'X'
          import sys, json, re
          sys.path.insert(0, "collector")
          import collect as c
          d = json.load(open("docs/data/results/11136.json"))
          ok = 0
          for sd in d["matches"]:
              sd.pop("veto", None)
              c.attach_veto(sd)
              ok += bool(sd.get("veto"))
              print("PR|", sd["date"][:16], [t["name"] for t in sd["teams"]], "V" if sd.get("veto") else "-")
          print("PR| total", ok, "/", len(d["matches"]))
          X
