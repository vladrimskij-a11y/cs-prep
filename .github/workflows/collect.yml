name: Обновить данные (полный сбор)

on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: collect-full
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Установить библиотеку для чтения статей
        run: pip install --quiet trafilatura pillow

      - name: Взять текущие данные (ветка data)
        run: |
          mkdir -p docs/data
          if git fetch -q --depth 1 origin data; then git archive FETCH_HEAD | tar -x -C docs/data; fi

      - name: Восстановить кэш сборщика
        uses: actions/cache/restore@v4
        with:
          path: cache
          key: collector-cache-${{ github.run_id }}
          restore-keys: collector-cache-

      - name: Восстановить кэш новостей
        uses: actions/cache/restore@v4
        with:
          path: cache_news
          key: news-cache-${{ github.run_id }}
          restore-keys: news-cache-

      - name: Слить кэши
        run: python tools/merge_cache.py cache cache_news

      - name: Сбор
        env:
          PANDASCORE_TOKEN: ${{ secrets.PANDASCORE_TOKEN }}
          GIGACHAT_KEY: ${{ secrets.GIGACHAT_KEY }}
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
        run: python collector/collect.py

      - name: Сохранить кэш сборщика
        if: always()
        uses: actions/cache/save@v4
        with:
          path: cache
          key: collector-cache-${{ github.run_id }}

      - name: Сохранить данные (ветка data, слияние с параллельными сборами)
        run: python collector/save_data.py full "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"

      - name: Версия сайта
        run: sh tools/stamp.sh

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - uses: actions/deploy-pages@v4
        continue-on-error: true   # если параллельно публикует другой сбор — сайт обновит следующий
