name: Обновить данные (полный сбор)

on:
  schedule:
    - cron: "17 * * * *"  # раз в час (владелец 06.11): свежие VRS и прогнозы; тяжёлое к HLTV — по своим срокам
    - cron: "47 * * * *"  # 25.11: запасной запуск — GitHub опаздывает с расписанием; если прошлый сбор был < 45 мин назад, выходит сразу
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: collect-full
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      go: ${{ steps.g.outputs.go }}
    steps:
      - id: g
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          go=1
          if [ "${{ github.event_name }}" = "schedule" ]; then
            # считаются только настоящие сборы: пропущенный запуск (gate → skip) длится ~20 с и тоже «success» —
            # 26.11 из-за него каждый пропуск сдвигал отсчёт, и полный сбор не шёл с 15:04 до 16:12 (рейтинг VRS устарел)
            last=""
            for row in $(gh api "repos/${{ github.repository }}/actions/workflows/collect.yml/runs?per_page=10" \
                --jq '.workflow_runs[] | select(.id != ${{ github.run_id }}) | "\(.id),\(.status),\(.run_started_at)"'); do
              id=${row%%,*}; rest=${row#*,}; st=${rest%%,*}; started=${rest#*,}
              if [ "$st" = "in_progress" ] || [ "$st" = "queued" ]; then last=$started; break; fi
              # сбор шёл на деле — задание run выполнено (а не пропущено)
              rc=$(gh api "repos/${{ github.repository }}/actions/runs/$id/jobs" --jq '[.jobs[] | select(.name == "run") | .conclusion][0]')
              if [ "$rc" = "success" ] || [ "$rc" = "failure" ] || [ "$rc" = "cancelled" ]; then last=$started; break; fi
            done
            if [ -n "$last" ] && [ "$last" != "null" ]; then
              age=$(( $(date +%s) - $(date -d "$last" +%s) ))
              echo "Прошлый полный сбор начат $((age / 60)) мин назад"
              [ $age -lt 2700 ] && go=0
            fi
          fi
          echo "go=$go" >> "$GITHUB_OUTPUT"
  run:
    needs: gate
    if: needs.gate.outputs.go == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 27.11: сборка lxml однажды упала — и весь сбор вместе с ней. Сборщик без этих библиотек работает (проще читает статьи),
      # поэтому: только готовые сборки, один повтор, и сбор идёт дальше даже при неудаче
      - name: Установить библиотеку для чтения статей
        continue-on-error: true
        run: pip install --quiet --prefer-binary trafilatura pillow || (sleep 20; pip install --quiet --prefer-binary trafilatura pillow)

      - name: Взять текущие данные (ветка data)
        run: |
          mkdir -p docs/data
          if git fetch -q --depth 1 origin data; then git archive FETCH_HEAD | tar -x -C docs/data; fi

      - name: Восстановить кэш сборщика
        uses: actions/cache/restore@v4
        with:
          path: cache
          key: collector-cache-${{ github.run_id }}
          restore-keys: collector-cache-

      - name: Восстановить кэш новостей
        uses: actions/cache/restore@v4
        with:
          path: cache_news
          key: news-cache-${{ github.run_id }}
          restore-keys: news-cache-

      - name: Слить кэши
        run: python tools/merge_cache.py cache cache_news

      - name: Сбор
        env:
          PANDASCORE_TOKEN: ${{ secrets.PANDASCORE_TOKEN }}
          ODDSPAPI_KEY: ${{ secrets.ODDSPAPI_KEY }}
          GIGACHAT_KEY: ${{ secrets.GIGACHAT_KEY }}
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
          GROQ_KEY: ${{ secrets.GROQ_KEY }}
          MISTRAL_KEY: ${{ secrets.MISTRAL_KEY }}
        run: python collector/collect.py

      # 27.11: полный сбор и статистика идут одновременно — кто сохранял кэш последним, затирал записи другого
      # (проверка русских имён шла заново каждый час, тратя лимит Google). Перед сохранением добираем свежий кэш.
      - name: Отложить свой кэш
        if: always()
        run: if [ -d cache ]; then mv cache cache_mine; fi

      - name: Взять кэш, сохранённый другими сборами за это время
        if: always()
        uses: actions/cache/restore@v4
        with:
          path: cache
          key: collector-cache-latest-${{ github.run_id }}
          restore-keys: collector-cache-

      - name: Слить свой кэш со свежим
        if: always()
        run: if [ -d cache_mine ]; then python tools/merge_cache.py cache_mine cache && rm -rf cache && mv cache_mine cache; fi

      - name: Сохранить кэш сборщика
        if: always()
        uses: actions/cache/save@v4
        with:
          path: cache
          key: collector-cache-${{ github.run_id }}

      - name: Сохранить данные (ветка data, слияние с параллельными сборами)
        run: python collector/save_data.py full "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"

      - name: Версия сайта
        run: sh tools/stamp.sh

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - uses: actions/deploy-pages@v4
        id: d1
        continue-on-error: true   # если параллельно публикует другой сбор — сайт обновит следующий
      - if: steps.d1.outcome == 'failure'
        run: sleep 30
      - uses: actions/deploy-pages@v4
        if: steps.d1.outcome == 'failure'
        continue-on-error: true   # 24.11: «No artifacts named github-pages» — повтор
