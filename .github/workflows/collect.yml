name: Обновить данные

on:
  schedule:
    - cron: "17 */3 * * *"   # каждые 3 часа
  workflow_dispatch:          # кнопка «Run workflow» для ручного запуска

permissions:
  contents: write   # сохранить свежие данные в репозиторий
  models: read      # бесплатная нейросеть GitHub Models для новостей

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Собрать матчи, статистику и новости
        env:
          PANDASCORE_TOKEN: ${{ secrets.PANDASCORE_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AI_MODEL: ${{ vars.AI_MODEL || 'openai/gpt-4.1-mini' }}
        run: python collector/collect.py

      - name: Сохранить данные
        run: |
          git config user.name "cs-prep-bot"
          git config user.email "cs-prep-bot@users.noreply.github.com"
          git add docs/data cache
          git diff --cached --quiet || git commit -m "Данные: $(date -u +'%Y-%m-%d %H:%M') UTC"
          git push
