name: Обновить данные

on:
  schedule:
    - cron: "17 */3 * * *"   # каждые 3 часа
  workflow_dispatch:          # кнопка «Run workflow» для ручного запуска
  push:                       # и сразу после обновления сборщика
    branches: [main]
    paths: ["collector/**", ".github/workflows/collect.yml"]

permissions:
  contents: write   # сохранить свежие данные в репозиторий

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Восстановить кэш сборщика
        uses: actions/cache/restore@v4
        with:
          path: cache
          key: collector-cache-${{ github.run_id }}
          restore-keys: collector-cache-

      - name: Установить библиотеку для чтения статей
        run: pip install --quiet trafilatura

      - name: Собрать матчи, статистику и новости
        env:
          PANDASCORE_TOKEN: ${{ secrets.PANDASCORE_TOKEN }}
          GIGACHAT_KEY: ${{ secrets.GIGACHAT_KEY }}
        run: python collector/collect.py

      - name: Сохранить кэш сборщика
        if: always()
        uses: actions/cache/save@v4
        with:
          path: cache
          key: collector-cache-${{ github.run_id }}

      - name: Сохранить данные
        run: |
          git config user.name "cs-prep-bot"
          git config user.email "cs-prep-bot@users.noreply.github.com"
          git add docs/data
          git diff --cached --quiet || git commit -m "Данные: $(date -u +'%Y-%m-%d %H:%M') UTC"
          for i in 1 2 3; do
            git pull --rebase --autostash -q origin main && git push && exit 0
            sleep 5
          done
          exit 1
