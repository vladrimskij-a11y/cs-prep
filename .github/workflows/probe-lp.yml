name: probe lp
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: probe
        run: |
          cd collector && python - <<'PY'
          import re, collect as c
          T = ["Intel_Extreme_Masters/2026/Beijing", "PGL/2026/Bucharest", "ESL/Pro_League/Season_24", "Intel_Extreme_Masters/2026/Cologne",
               "PGL/2026/Singapore", "BLAST/Major/2025/Austin", "Perfect_World/Major/2025/Shanghai", "PGL/2024/Copenhagen",
               "Valve_Regional_Standings", "Majors", "Counter-Strike_Major_Championships"]
          P = c.lp_pages(T)
          def ctx(x, kw, n=900, k=2):
              out, i = [], x.find(kw)
              while i >= 0 and len(out) < k:
                  out.append(x[max(0, i - 150): i + n]); i = x.find(kw, i + n)
              return out
          for t in ("PGL/2026/Bucharest", "ESL/Pro_League/Season_24", "BLAST/Major/2025/Austin", "Valve_Regional_Standings"):
              x = P.get(t) or ""
              print("=== PAGE", t)
              for kw, n, k in (("MVP", 500, 3), ("{{Slot", 700, 2), ("{{TeamCard", 1200, 1), ("{{Opponent", 300, 2), ("qualifies", 300, 1)):
                  for sn in ctx(x, kw, n, k):
                      print("--- " + kw); print(sn)
          print("=== VRS FULL"); print((P.get("Valve_Regional_Standings") or "")[:2500])
          PY
