name: probe lp
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: probe
        run: |
          cd collector && python - <<'PY'
          import re, json, time, urllib.parse, collect as c
          def osearch(q):
              time.sleep(4)
              u = c.LP_API + "?" + urllib.parse.urlencode({"action": "opensearch", "search": q, "limit": 8, "format": "json"})
              return json.loads(c.http_get(u, {"User-Agent": c.LP_UA, "Accept": "application/json"}))[1]
          for q in ("Intel Extreme Masters Beijing 2026", "IEM Beijing 2026", "PGL Masters Bucharest", "ESL Pro League Season 24", "BLAST Open Fall 2026", "StarLadder Budapest Major"):
              print("SEARCH", q, "->", osearch(q))
          for pg in ("ESL/Pro_League/Season_24", "Intel_Extreme_Masters/2026/Beijing", "PGL/2026/Bucharest"):
              t = c.lp_pages([pg]).get(pg) or ""
              print("=== PAGE", pg, len(t))
              for ln in t.split("\n"):
                  if re.search(r"(?i)veto|seed|higher|coin|choose|first ban|pick", ln):
                      print("  |", ln[:400])
          PY
